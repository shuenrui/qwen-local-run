<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qwen Local-Run Directory</title>
<meta name="description" content="Choose a Qwen model, see its practical hardware floor, then inspect every source-backed local-run recipe.">
<style>
/* Qwen Local-Run Directory — design system.
   A technical index: hierarchy from type, alignment and rules. Colour is a
   signal, never a surface. See docs/redesign-2026-09-10/02-design-system.md. */

:root{
  --paper:#fbfaf8; --surface:#ffffff; --sunk:#f4f3f0; --sunk-2:#edebe7;
  --ink:#15171a; --ink-2:#4a4f57; --ink-3:#767c85; --ink-4:#9aa0a8;
  --rule:#e6e4e0; --rule-2:#cfccc6; --rule-3:#a8a49d;

  --sel:#1f4fd8; --sel-bg:#eef2fe; --sel-line:#b9c8f6;
  --ok:#1a6f4a;  --ok-bg:#e9f4ee;  --ok-line:#a9d3bd;
  --est:#7a5a12; --est-bg:#f8f1df; --est-line:#dfc78d;
  --warn:#8a4b12;--warn-bg:#faefe4;--warn-line:#e2bc95;
  --bad:#a32820; --bad-bg:#fcecea; --bad-line:#eeb4ad;

  --font-ui:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,"Cascadia Mono",Consolas,monospace;
  --maxw:1440px; --rail-w:208px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121316; --surface:#191b1f; --sunk:#212429; --sunk-2:#282c32;
    --ink:#eceef1; --ink-2:#b3b9c2; --ink-3:#868d97; --ink-4:#646b75;
    --rule:#2a2e34; --rule-2:#3a3f47; --rule-3:#545a63;
    --sel:#7d9cff; --sel-bg:#1a2138; --sel-line:#33427a;
    --ok:#5fc79a;  --ok-bg:#132720;  --ok-line:#2c5544;
    --est:#e0b45c; --est-bg:#2a2216; --est-line:#5c4a25;
    --warn:#f0a068;--warn-bg:#2c1d14;--warn-line:#5e3c25;
    --bad:#ff8b80; --bad-bg:#2d1715; --bad-line:#63302c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121316; --surface:#191b1f; --sunk:#212429; --sunk-2:#282c32;
  --ink:#eceef1; --ink-2:#b3b9c2; --ink-3:#868d97; --ink-4:#646b75;
  --rule:#2a2e34; --rule-2:#3a3f47; --rule-3:#545a63;
  --sel:#7d9cff; --sel-bg:#1a2138; --sel-line:#33427a;
  --ok:#5fc79a;  --ok-bg:#132720;  --ok-line:#2c5544;
  --est:#e0b45c; --est-bg:#2a2216; --est-line:#5c4a25;
  --warn:#f0a068;--warn-bg:#2c1d14;--warn-line:#5e3c25;
  --bad:#ff8b80; --bad-bg:#2d1715; --bad-line:#63302c;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font:400 14px/1.5 var(--font-ui);
  font-variant-numeric:tabular-nums;
  overflow-x:hidden;
}
h1,h2,h3,h4,p,ul,ol,dl,dd,figure{margin:0}
ul,ol{padding:0;list-style:none}
a{color:var(--sel); text-underline-offset:2px}
a:hover{text-decoration-thickness:2px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sel); outline-offset:2px; border-radius:2px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:8px;top:-40px;z-index:60;background:var(--surface);
  border:1px solid var(--rule-2);padding:8px 12px;transition:top .1s}
.skip:focus{top:8px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* ---------- primitives ---------- */
.lbl{font:620 10.5px/1.35 var(--font-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.mono{font-family:var(--font-mono);font-size:12.5px;font-weight:450}
.na{color:var(--ink-4);font-style:italic}
.prose{max-width:68ch;color:var(--ink-2);line-height:1.55}
.num{font-variant-numeric:tabular-nums}
.g{color:var(--ink-3)}

.mark{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;
  font-size:12px;font-weight:560;padding:1px 6px;border:1px solid;border-radius:3px}
.m-ok{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-line)}
.m-est{color:var(--est);background:var(--est-bg);border-color:var(--est-line)}
.m-warn{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-line)}
.m-bad{color:var(--bad);background:var(--bad-bg);border-color:var(--bad-line)}
.m-none{color:var(--ink-3);background:var(--sunk);border-color:var(--rule-2)}
.m-sel{color:var(--sel);background:var(--sel-bg);border-color:var(--sel-line)}

.tag{display:inline-block;font-size:12px;color:var(--ink-2);background:var(--sunk);
  border:1px solid var(--rule);border-radius:3px;padding:0 5px;white-space:nowrap}

/* ---------- masthead ---------- */
.mast{position:sticky;top:0;z-index:30;background:var(--paper);
  border-bottom:1px solid var(--rule-2)}
.mast-bar{max-width:var(--maxw);margin:0 auto;padding:0 20px;height:44px;
  display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);flex:none}
.brand-mark{font:700 10.5px/1 var(--font-mono);letter-spacing:.08em;
  border:1px solid var(--rule-3);padding:4px 5px;color:var(--ink-2)}
.brand-name{font:620 13.5px/1 var(--font-ui);letter-spacing:-.01em}
.tabs{display:flex;gap:2px;flex:none}
.tab{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 12px;
  text-decoration:none;color:var(--ink-2);font-weight:560;font-size:13.5px;
  border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink);background:var(--sunk)}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
.tab-n{font:600 11px/1 var(--font-mono);color:var(--sel);background:var(--sel-bg);
  border:1px solid var(--sel-line);border-radius:8px;padding:2px 5px}
.mast-util{margin-left:auto;display:flex;align-items:center;gap:14px;flex:none}
.ulink{font-size:12.5px;color:var(--ink-3);text-decoration:none}
.ulink:hover{color:var(--ink);text-decoration:underline}
.icon-btn{background:none;border:1px solid var(--rule-2);border-radius:3px;
  width:26px;height:24px;cursor:pointer;color:var(--ink-3);line-height:1}
.icon-btn:hover{color:var(--ink);border-color:var(--rule-3)}
.mast-sub{max-width:var(--maxw);margin:0 auto;padding:0 20px 7px;
  font-size:12.5px;color:var(--ink-3);max-width:min(var(--maxw),100%)}
.mast-sub b{color:var(--ink-2);font-weight:560}

/* ---------- shell ---------- */
.shell{max-width:var(--maxw);margin:0 auto;padding:0 20px;
  display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);gap:0 24px;align-items:start}
.main{min-width:0;padding-bottom:120px}
.main:focus{outline:none}

/* ---------- family rail ---------- */
.rail[hidden]{display:none}
.rail{position:sticky;top:78px;max-height:calc(100vh - 96px);overflow:auto;
  padding:14px 0 40px;border-right:1px solid var(--rule);margin-right:-1px}
.rail-grp+.rail-grp{margin-top:16px}
.rail-grp>.lbl{display:block;padding:0 8px 5px}
.rail a,.rail button{display:flex;width:100%;gap:8px;align-items:baseline;
  text-align:left;background:none;border:0;cursor:pointer;
  padding:4px 8px;font-size:13px;color:var(--ink-2);text-decoration:none;border-left:2px solid transparent}
.rail a:hover,.rail button:hover{background:var(--sunk);color:var(--ink)}
.rail .rc{margin-left:auto;font:450 11.5px/1 var(--font-mono);color:var(--ink-4)}
.rail [aria-pressed="true"]{color:var(--sel);border-left-color:var(--sel);background:var(--sel-bg);font-weight:560}
.rail [data-spy="1"]{color:var(--ink);border-left-color:var(--rule-3);font-weight:560}

/* ---------- filter bar ---------- */
.bar{position:sticky;top:44px;z-index:20;background:var(--paper);
  padding:10px 0 8px;border-bottom:1px solid var(--rule-2)}
.bar-search{display:flex;gap:8px;align-items:center}
#q{flex:1;min-width:0;height:34px;padding:0 10px;font:400 13.5px var(--font-ui);
  color:var(--ink);background:var(--surface);border:1px solid var(--rule-2);border-radius:3px}
#q::placeholder{color:var(--ink-4)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.fsel{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 6px 0 8px;
  background:var(--surface);border:1px solid var(--rule-2);border-radius:3px;font-size:12.5px}
.fsel>span{color:var(--ink-3);font-size:11.5px}
.fsel select{border:0;background:none;font:inherit;color:var(--ink);
  max-width:140px;padding:0;cursor:pointer}
.fsel:focus-within{border-color:var(--sel)}
.fsel.on{border-color:var(--sel);background:var(--sel-bg)}
.btn{height:28px;padding:0 10px;background:var(--surface);border:1px solid var(--rule-2);
  border-radius:3px;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.btn:hover{border-color:var(--rule-3);color:var(--ink)}
.btn.on{border-color:var(--sel);color:var(--sel);background:var(--sel-bg)}
.btn-p{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:560}
.btn-p:hover{opacity:.88;color:var(--paper)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.bar-end{margin-left:auto;display:flex;gap:8px;align-items:center}
.count{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.count b{color:var(--ink);font-weight:620}

.adv{margin-top:8px;padding:12px;background:var(--sunk);border:1px solid var(--rule)}
.adv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:10px 16px}
.adv-note{margin-top:10px;font-size:12px;color:var(--ink-3);max-width:68ch}
.fld{display:block}
.fld>.lbl{display:block;margin-bottom:3px}
.fld select,.fld input[type=text],.fld input[type=number]{width:100%;height:28px;
  background:var(--surface);border:1px solid var(--rule-2);border-radius:3px;
  font:400 12.5px var(--font-ui);color:var(--ink);padding:0 6px}
.range{display:flex;gap:6px;align-items:center}
.range input{width:100%}

.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 4px 0 8px;
  font-size:12px;background:var(--sel-bg);color:var(--sel);
  border:1px solid var(--sel-line);border-radius:3px;cursor:pointer}
.chip b{font-weight:620}
.chip:hover{background:var(--surface)}
.chip .x{font-size:13px;line-height:1}

.disclose{margin:12px 0 0;padding:10px 12px;background:var(--warn-bg);
  border:1px solid var(--warn-line);
  color:var(--warn);font-size:12.5px;max-width:78ch}
.disclose b{font-weight:620}

/* ---------- shelf ---------- */
.shelf{margin-top:26px;scroll-margin-top:118px}
.shelf-head{border-top:2px solid var(--rule-3);padding-top:10px}
.shelf-top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.shelf-top h2{font:640 26px/1.15 var(--font-ui);letter-spacing:-.015em}
.shelf-top h2 a{color:inherit;text-decoration:none}
.shelf-top h2 a:hover{text-decoration:underline}
.shelf-meta{margin-left:auto;font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.shelf-meta b{color:var(--ink-2);font-weight:560}
.spec{display:flex;flex-wrap:wrap;gap:4px 26px;margin-top:9px}
.spec>div{min-width:0}
.spec .lbl{display:block}
.spec .v{font-size:13px;color:var(--ink);white-space:nowrap}
.spec .v.mono{font-size:12.5px}
.regr{margin-top:8px}
.regr>summary{cursor:pointer;font-size:12.5px;color:var(--warn);width:max-content}
.regr ul{margin-top:6px;padding-left:16px;list-style:disc;color:var(--ink-2);
  font-size:12.5px;max-width:68ch}
.regr li{margin:3px 0}

/* ---------- model-first home ---------- */
.models-home{padding:22px 0 44px}
.models-intro{display:flex;align-items:end;gap:20px;border-bottom:2px solid var(--rule-3);padding-bottom:13px}
.models-intro h1{font:640 28px/1.1 var(--font-ui);letter-spacing:-.02em;white-space:nowrap}
.models-intro p{max-width:72ch;color:var(--ink-2);line-height:1.5}
.model-controls{display:grid;grid-template-columns:minmax(260px,1fr) auto auto auto auto;gap:8px;
  align-items:end;padding:11px 0;border-bottom:1px solid var(--rule-2)}
.model-controls label{display:block}
.model-controls .lbl{display:block;margin-bottom:3px}
.model-controls input,.model-controls select{height:32px;background:var(--surface);color:var(--ink);
  border:1px solid var(--rule-2);border-radius:3px;padding:0 8px;font:400 12.5px var(--font-ui)}
.model-controls input{width:100%;font-size:13.5px}
.model-controls input::placeholder{color:var(--ink-3)}
.model-controls select{min-width:118px}
.model-controls input:focus,.model-controls select:focus{border-color:var(--sel)}
.model-count{align-self:center;margin-top:15px;color:var(--ink-3);font-size:12.5px;white-space:nowrap}
.model-count b{color:var(--ink);font-weight:620}
.model-master{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,430px);gap:28px;align-items:start}
.model-index{min-width:0}
.model-list-head,.model-row{display:grid;grid-template-columns:minmax(210px,1.25fr) 104px minmax(210px,1fr) 142px 34px;
  gap:10px;align-items:center}
.model-list-head{padding:10px 10px 6px;color:var(--ink-3);font:620 10.5px/1.35 var(--font-ui);
  letter-spacing:.07em;text-transform:uppercase;border-bottom:1px solid var(--rule-2)}
.model-list>li{border-bottom:1px solid var(--rule)}
.model-row{position:relative;width:100%;min-height:70px;padding:9px 10px;background:none;border:0;text-align:left;cursor:pointer}
.model-row:hover{background:var(--sunk)}
.model-row:active{transform:translateY(1px)}
.model-row.is-selected{background:var(--sel-bg)}
.model-row.is-selected::before{content:"";position:absolute;left:0;top:0;bottom:0;width:1px;background:var(--sel)}
.model-row>span{min-width:0}
.model-id,.model-context,.model-floor,.model-speed{display:flex;flex-direction:column;gap:2px}
.model-id strong{font-size:14px;font-weight:620;line-height:1.3;color:var(--ink)}
.model-id>span,.model-row small{font-size:11.5px;line-height:1.35;color:var(--ink-3)}
.model-context>span:not(.lbl),.model-floor>span:not(.lbl){font-size:12.5px;color:var(--ink);line-height:1.35}
.model-floor small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.model-speed strong{font:600 18px/1.15 var(--font-ui);color:var(--ink)}
.model-speed strong small{font:400 11.5px/1 var(--font-ui);color:var(--ink-3)}
.model-open{justify-self:end;color:var(--sel);font-size:11.5px;font-weight:560}
.model-preview{position:sticky;top:86px;margin-top:12px;padding:15px 16px 17px;background:var(--surface);
  border:1px solid var(--rule-2);max-height:calc(100vh - 104px);overflow:auto}
.model-preview-head h2{font:640 23px/1.18 var(--font-ui);letter-spacing:-.015em;margin-top:3px}
.model-preview-head p{margin-top:7px;color:var(--ink-2);font-size:13px;line-height:1.5}
.model-tags{display:flex;flex-wrap:wrap;gap:5px 12px;margin-top:9px;color:var(--ink-3);font-size:11.5px}
.baseline,.baseline-missing{margin-top:16px;border-top:1px solid var(--rule-2);padding-top:13px}
.baseline-title{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.baseline-title h3{font:620 17px/1.3 var(--font-ui);margin-top:2px;max-width:25ch}
.baseline-why,.baseline-missing p{margin-top:7px;color:var(--ink-2);font-size:12.5px;line-height:1.5}
.baseline-missing h3{font:620 15px/1.3 var(--font-ui);color:var(--warn)}
.baseline-spec{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-top:13px}
.baseline-spec>div{min-width:0}
.baseline-spec>div.wide{grid-column:1/-1;border-top:1px solid var(--rule);padding-top:9px}
.baseline-spec dt{font:620 10.5px/1.35 var(--font-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.baseline-spec dd{margin-top:2px;font-size:12.5px;line-height:1.45;color:var(--ink);overflow-wrap:anywhere}
.baseline-speed{margin-top:14px;padding:11px 12px;background:var(--sunk);border:1px solid var(--rule)}
.speed-line{display:flex;align-items:baseline;gap:10px;margin-top:4px;flex-wrap:wrap}
.speed-line strong{font:640 25px/1.1 var(--font-ui);letter-spacing:-.015em}
.speed-line strong small{font:400 12px/1 var(--font-ui);color:var(--ink-3);letter-spacing:0}
.speed-line span{font-size:11.5px;color:var(--ink-3)}
.baseline-speed p{margin-top:5px;color:var(--ink-2);font-size:11.5px;line-height:1.45}
.baseline-speed a{display:inline-block;margin-top:5px;font-size:11.5px}
.baseline-trade{margin-top:14px}
.baseline-trade h3{font:620 13px/1.3 var(--font-ui)}
.baseline-trade ul{margin-top:5px;padding-left:16px;list-style:disc;color:var(--ink-2);font-size:12px;line-height:1.45}
.baseline-trade li+li{margin-top:4px}
.model-preview-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px;padding-top:12px;border-top:1px solid var(--rule-2)}
.model-preview-actions .btn{display:inline-flex;align-items:center;text-decoration:none;white-space:nowrap}
.model-page-baseline>.model-preview-head{display:none}
.model-page-baseline .model-preview-actions a:first-child{display:none}

/* ---------- rows (desktop table) ---------- */
.rows{width:100%;border-collapse:collapse;margin-top:10px;table-layout:fixed}
.rows caption{text-align:left;position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.rows thead th{
  font:620 10.5px/1.35 var(--font-ui);letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-3);text-align:left;padding:0 8px 5px;border-bottom:1px solid var(--rule-2);
  font-weight:620}
.rows th.r,.rows td.r{text-align:right}
.c-sel{width:30px} .c-quant{width:98px} .c-eng{width:124px} .c-hw{width:140px}
.c-ready{width:96px} .c-dec{width:158px} .c-ev{width:74px} .c-upd{width:70px} .c-exp{width:30px}
.rows th.c-ev{white-space:nowrap}
.ev-hd{display:block;font:620 8.5px/1 var(--font-ui);letter-spacing:.14em;color:var(--ink-4);margin-top:3px}
.rows tbody tr{border-bottom:1px solid var(--rule)}
.rows tbody tr:hover{background:var(--sunk)}
.rows tbody tr[data-row]{cursor:pointer}
.rows tbody tr[data-row] input,.rows tbody tr[data-row] button{cursor:auto}
.rows tbody tr[data-row] button:hover{cursor:pointer}
.rows td{padding:8px;vertical-align:top;overflow-wrap:anywhere}
.rows tbody tr:not(.det){height:1px}
.rows tr.sel-on{background:var(--sel-bg)}
.rows tr.sel-on:hover{background:var(--sel-bg)}
.rows td.c-sel{position:relative}
tr.sel-on td.c-sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--sel)}
tr.fail td.c-sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--bad)}
.l1{font-size:14px;font-weight:560;line-height:1.35}
.l1.mono{font-weight:450;font-size:13px}
.l2{font-size:12.5px;color:var(--ink-3);line-height:1.35;margin-top:2px}
td .l2.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.l2 .warn{color:var(--warn)} .l2 .bad{color:var(--bad)}
.dec-v{font:600 19px/1.15 var(--font-ui);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.dec-u{font-size:11.5px;color:var(--ink-3);font-weight:400;margin-left:2px}
td.c-dec .l2{margin-top:1px}
.cbx{width:15px;height:15px;margin:2px 0 0;accent-color:var(--sel);cursor:pointer}
.exp-btn{width:24px;height:24px;background:none;border:1px solid transparent;border-radius:3px;
  cursor:pointer;color:var(--ink-3);line-height:1;font-size:11px}
.exp-btn:hover{border-color:var(--rule-2);color:var(--ink)}
tr.open{background:var(--sunk)}

/* evidence strip */
.ev{display:inline-flex;gap:3px;cursor:help;background:none;border:0;padding:2px 0}
.ev i{font-style:normal;font-size:12px;line-height:1;width:13px;text-align:center}
.ev .v-ok{color:var(--ok)} .ev .v-est{color:var(--est)}
.ev .v-none{color:var(--ink-4)} .ev .v-bad{color:var(--bad)}

/* detail panel */
tr.det>td{padding:0;border-bottom:1px solid var(--rule-2)}
.det-in{background:var(--surface);border-left:1px solid var(--rule-2);padding:16px 18px 18px}
.det-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px 26px}
.sec+.sec{margin-top:16px}
.sec>h2,.sec>h3{font:620 15px/1.3 var(--font-ui);margin-bottom:7px}
.sec>h2 .g,.sec>h3 .g{font-weight:400;font-size:12.5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:13px}
.kv dt{font:620 10.5px/1.5 var(--font-ui);letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-3);white-space:nowrap}
.kv dd{margin:0;color:var(--ink);min-width:0;overflow-wrap:anywhere}
.cmd{display:flex;gap:8px;align-items:flex-start;background:var(--sunk);
  border:1px solid var(--rule);padding:7px 8px;margin:5px 0}
.cmd code{flex:1;min-width:0;font-family:var(--font-mono);font-size:12.5px;
  white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink)}
.copy{flex:none;height:22px;padding:0 8px;font-size:11.5px;background:var(--surface);
  border:1px solid var(--rule-2);border-radius:3px;cursor:pointer;color:var(--ink-2)}
.copy:hover{border-color:var(--rule-3);color:var(--ink)}
.steps{counter-reset:s;margin:4px 0}
.steps>li{counter-increment:s;display:grid;grid-template-columns:22px 1fr;gap:8px;
  padding:3px 0;font-size:13px;align-items:start}
.steps>li::before{content:counter(s) ".";color:var(--ink-4);font:450 11.5px/1.7 var(--font-mono)}
.steps .do{color:var(--ink-2);line-height:1.5}
.notes{margin:0;padding-left:16px;list-style:disc;color:var(--ink-2);font-size:13px;max-width:68ch}
.notes li{margin:4px 0;line-height:1.5}
.notes.bad li::marker{color:var(--bad)}
.notes.warn li::marker{color:var(--warn)}
.mtab{width:100%;border-collapse:collapse;font-size:12.5px}
.mtab th{text-align:left;font:620 10.5px/1.4 var(--font-ui);letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink-3);padding:0 8px 4px 0;border-bottom:1px solid var(--rule)}
.mtab td{padding:5px 8px 5px 0;border-bottom:1px solid var(--rule);vertical-align:top;color:var(--ink-2)}
.mtab td.v{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:560;white-space:nowrap}
.mtab .tier{font:620 9.5px/1.4 var(--font-ui);letter-spacing:.08em;text-transform:uppercase}
.t-box{color:var(--ok)} .t-forum{color:var(--est)} .t-vendor{color:var(--ink-3)}
.tier-band{font:620 10.5px/1.4 var(--font-ui);letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-3);padding-top:9px}
.scrollx{overflow-x:auto}
.det-foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:12px;
  border-top:1px solid var(--rule)}
.srcs{display:grid;gap:5px;font-size:12.5px}
.srcs a{overflow-wrap:anywhere}
.srck{font:620 9.5px/1.4 var(--font-ui);letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);margin-right:6px}

/* mobile rows */
.rows-m{margin-top:10px}
.rows-m>li{border-bottom:1px solid var(--rule);padding:10px 0 10px 11px;position:relative}
.rows-m>li[data-row]>.mrow-top{cursor:pointer}
.rows-m>li[data-row]>.mrow-top input,.rows-m>li[data-row]>.mrow-top button{cursor:auto}
.rows-m>li[data-row]>.mrow-top button:hover{cursor:pointer}
.rows-m>li.sel-on{background:var(--sel-bg)}
.rows-m>li.sel-on::before,.rows-m>li.fail::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px}
.rows-m>li.sel-on::before{background:var(--sel)}
.rows-m>li.fail::before{background:var(--bad)}
.mrow-top{display:flex;gap:9px;align-items:flex-start}
.mrow-body{flex:1;min-width:0}
.mrow-l{display:flex;flex-wrap:wrap;gap:3px 12px;margin-top:5px;font-size:12.5px;color:var(--ink-3)}
.mrow-l .lbl{margin-right:4px}
.mrow-dec{display:flex;align-items:baseline;gap:7px;margin-top:6px;flex-wrap:wrap}
.mrow-act{display:flex;gap:8px;align-items:center;margin-top:7px;flex-wrap:wrap}
.rows-m .det-in{margin-top:10px;padding:12px 12px 14px}

/* ---------- compare rail ---------- */
.crail{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);
  border-top:1px solid var(--rule-2);box-shadow:0 -1px 0 var(--rule);
  padding:10px 20px 11px;transform:translateY(8px);animation:rise .14s ease-out forwards}
@keyframes rise{to{transform:translateY(0)}}
.crail-in{max-width:var(--maxw);margin:0 auto;display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.crail-hd{font:620 10.5px/1.4 var(--font-ui);letter-spacing:.07em;text-transform:uppercase;
  color:var(--sel);flex:none;padding-top:4px}
.crail-items{display:flex;gap:8px;flex-wrap:wrap;flex:1;min-width:0}
.citem{display:flex;gap:8px;align-items:flex-start;min-width:170px;max-width:250px;
  border:1px solid var(--rule-2);padding:5px 7px}
.citem .cbody{min-width:0;flex:1}
.citem .cn{font-size:12.5px;font-weight:560;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.citem .cs{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.cx{flex:none;width:20px;height:20px;background:none;border:0;cursor:pointer;
  color:var(--ink-3);font-size:13px;line-height:1;border-radius:3px}
.cx:hover{background:var(--sunk);color:var(--bad)}
.crail-end{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-left:auto;min-width:0}
.crail-end .btn,.crail-end .btn-p{white-space:nowrap}
.crail-cmp{flex-basis:100%;font-size:12px;margin-top:2px;white-space:normal;align-items:flex-start}

/* ---------- compare workspace ---------- */
.cmp-wrap{overflow-x:auto;margin-top:14px;border:1px solid var(--rule)}
.cmp{border-collapse:collapse;width:100%;min-width:640px;font-size:13px}
.cmp th,.cmp td{border-bottom:1px solid var(--rule);border-right:1px solid var(--rule);
  padding:7px 10px;vertical-align:top;text-align:left}
.cmp col.k{width:190px}
.cmp th.k{position:sticky;left:0;background:var(--paper);z-index:1;
  font:620 10.5px/1.4 var(--font-ui);letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-3);font-weight:620;white-space:normal}
.cmp thead th{background:var(--sunk);font-size:13px;font-weight:620;color:var(--ink);vertical-align:bottom}
.cmp thead th.k{background:var(--sunk)}
.cmp tr.grp th{background:var(--sunk-2);font:620 11px/1.4 var(--font-ui);letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-2);border-top:2px solid var(--rule-2)}
.cmp tr.grp th.k{background:var(--sunk-2)}
.cmp td .cond,.cmp th .cond{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px;font-weight:400}
.cmp .rowflag{font-size:11px;color:var(--warn);font-weight:560;display:block;margin-top:3px}
.cmp-key{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--ink-3)}
.banner{margin-top:14px;border:1px solid;padding:11px 13px;max-width:88ch}
.banner h3{font:620 13px/1.3 var(--font-ui);margin-bottom:5px}
.banner ul{margin-top:5px;padding-left:16px;list-style:disc;font-size:12.5px}
.banner li{margin:3px 0;line-height:1.5}
.b-warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.b-ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.b-info{background:var(--sunk);border-color:var(--rule-2);color:var(--ink-2)}

/* ---------- generic page ---------- */
.page{padding:20px 0 40px;max-width:1000px}
.page.wide{max-width:none}
.page h1{font:620 24px/1.2 var(--font-ui);letter-spacing:-.015em}
.page>p.lede{margin-top:7px;font-size:14px;color:var(--ink-2);max-width:68ch}
.crumb{font-size:12.5px;color:var(--ink-3);margin-bottom:9px}
.crumb a{color:var(--ink-3)}
.psec{margin-top:24px;border-top:1px solid var(--rule-2);padding-top:13px}
.psec>h2{font:620 16px/1.3 var(--font-ui);margin-bottom:9px}
.psec>h2 .g{font-weight:400;font-size:12.5px}
.psec h3{font:620 13px/1.3 var(--font-ui);margin:13px 0 5px}
.psec p{margin:7px 0;max-width:68ch;color:var(--ink-2);line-height:1.55}
.psec p.tight{margin:3px 0}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px 28px}
.rawjson{margin-top:10px}
.rawjson>summary{cursor:pointer;font-size:12.5px;color:var(--ink-2)}
.rawjson pre{margin-top:8px;background:var(--sunk);border:1px solid var(--rule);
  padding:11px;overflow:auto;max-height:460px;font:450 11.5px/1.55 var(--font-mono)}
.empty{padding:34px 0;max-width:68ch}
.empty h2{font:620 16px/1.3 var(--font-ui);margin-bottom:7px}
.empty p{color:var(--ink-2);margin:6px 0}
.empty .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* ---------- my hardware ---------- */
.hw{display:grid;grid-template-columns:380px minmax(0,1fr);gap:26px;padding:20px 0 40px;align-items:start}
.hw-pane{position:sticky;top:78px;border:1px solid var(--rule-2);background:var(--surface);padding:14px}
.hw-modes{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:10px 0 13px}
.hw-form{display:grid;gap:8px}
.hw-form.two-up{grid-template-columns:1fr 1fr;gap:8px 10px}
.hw-form.two-up .fld:first-child,.hw-form.two-up .fld:nth-child(2),.hw-form.two-up .fld:nth-child(3){grid-column:1 / -1}
.hw-form .fld input,.hw-form .fld select{width:100%}
.det-line{font-size:12px;color:var(--ink-3);margin-top:3px}
.det-res{margin-top:10px;font-size:12.5px;display:grid;gap:4px}
.det-res .row{display:grid;grid-template-columns:88px 1fr;gap:8px}
.privacy{margin-top:12px;padding:9px 10px;background:var(--sunk);border:1px solid var(--rule);
  font-size:11.5px;color:var(--ink-2);line-height:1.5}
.assump{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-top:10px;
  padding:11px 12px;background:var(--sunk);border:1px solid var(--rule)}
.grp-hd{display:flex;align-items:baseline;gap:10px;border-top:1px solid var(--rule-2);
  padding-top:11px;margin-top:20px;cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.grp-hd h2{font:620 13.5px/1.3 var(--font-ui);letter-spacing:.02em}
.grp-hd .n{margin-left:auto;font:600 13px/1 var(--font-mono);color:var(--ink-3)}
.res{border:1px solid var(--rule);border-left-width:3px;background:var(--surface);
  padding:11px 13px;margin-top:9px}
.res.v-ok{border-left-color:var(--ok)} .res.v-est{border-left-color:var(--est)}
.res.v-none{border-left-color:var(--rule-3)} .res.v-bad{border-left-color:var(--bad)}
.res-top{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.res-top h3{font:620 14px/1.35 var(--font-ui);flex:1;min-width:220px}
.res-top h3 a{color:inherit;text-decoration:none}
.res-top h3 a:hover{text-decoration:underline}
.verdict{margin-top:6px;font-size:13.5px;color:var(--ink);max-width:74ch;line-height:1.5}
.calc{margin-top:9px}
.calc>summary{cursor:pointer;font-size:12.5px;color:var(--ink-2);width:max-content}
.calc-tab{width:100%;border-collapse:collapse;margin-top:8px;font-size:12.5px;max-width:74ch}
.calc-tab th{text-align:left;font:620 10.5px/1.4 var(--font-ui);letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink-3);padding:4px 10px 4px 0;white-space:nowrap;
  vertical-align:top;width:170px}
.calc-tab td{padding:4px 0;color:var(--ink-2);vertical-align:top}
.calc-tab td b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.calc-tab tr.tot th,.calc-tab tr.tot td{border-top:1px solid var(--rule-2);padding-top:6px}
.res-act{display:flex;gap:8px;align-items:center;margin-top:9px;flex-wrap:wrap}

/* ---------- popover ---------- */
.pop{position:fixed;z-index:60;max-width:320px;background:var(--surface);
  border:1px solid var(--rule-3);padding:9px 11px;font-size:12.5px;color:var(--ink-2);
  box-shadow:0 2px 8px rgb(0 0 0 / .10);line-height:1.5}
.pop b{color:var(--ink)}
.pop dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin-top:5px}
.pop dt{font:620 10.5px/1.45 var(--font-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.pop dd{margin:0}

.foot{border-top:1px solid var(--rule);margin-top:20px;padding:16px 20px 90px}
.foot p{max-width:var(--maxw);margin:0 auto;font-size:12px;color:var(--ink-3)}

/* ---------- responsive ---------- */
@media (max-width:1179px){
  :root{--rail-w:0px}
  .shell{grid-template-columns:minmax(0,1fr);gap:0}
  .rail{display:none}
  .c-quant,.c-hw,.c-ev,.c-upd{display:none}
  .hw{grid-template-columns:minmax(0,1fr);gap:18px}
  .hw-pane{position:static}
  .model-master{grid-template-columns:minmax(0,1fr) minmax(320px,390px);gap:18px}
  .model-list-head,.model-row{grid-template-columns:minmax(180px,1.2fr) minmax(190px,1fr) 120px 30px}
  .model-list-head span:nth-child(2),.model-context{display:none}
}
@media (max-width:899px){
  .models-intro{display:block}
  .models-intro p{margin-top:6px}
  .model-controls{grid-template-columns:1fr 1fr 1fr}
  .model-search{grid-column:1/-1}
  .model-count{margin-top:0;align-self:end;padding-bottom:6px}
  .model-master{grid-template-columns:minmax(0,1fr)}
  .model-preview{position:static;grid-row:1;max-height:none;margin-top:12px}
  .model-index{grid-row:2}
  .model-list-head,.model-row{grid-template-columns:minmax(190px,1.2fr) minmax(200px,1fr) 126px 30px}
}
@media (max-width:719px){
  .mast-bar{height:auto;flex-wrap:wrap;padding:7px 14px 0;gap:10px}
  .mast-util .ulink{display:none}
  .tabs{order:3;flex-basis:100%;border-top:1px solid var(--rule)}
  .tab{flex:1;justify-content:center;height:40px;padding:0 6px;font-size:13px}
  .mast-sub{padding:0 14px 7px;font-size:12px}
  .shell{padding:0 14px}
  .bar{top:0;position:relative}
  .mast{position:static}
  .shelf-top h2{font-size:21px}
  .shelf{scroll-margin-top:12px}
  .filters{gap:5px}
  .fsel select{max-width:112px}
  .cbx{width:20px;height:20px}
  .exp-btn{width:34px;height:34px;font-size:13px}
  .btn{height:34px;padding:0 12px}
  .crail{padding:9px 14px 10px}
  .crail-items{display:none}
  .crail-end{width:100%;margin-left:0}
  .cmp col.k{width:150px}
  .page{padding:14px 0 30px}
  .det-grid{grid-template-columns:minmax(0,1fr)}
  .assump{padding:9px}
  .calc-tab th{width:auto;display:block;padding-bottom:0}
  .calc-tab td{display:block;padding-top:1px;padding-bottom:6px}
  /* label-above-value at narrow widths: a nowrap label column forces overflow */
  .kv{grid-template-columns:minmax(0,1fr);gap:0}
  .kv dt{white-space:normal;margin-top:7px}
  .kv dd{margin-bottom:2px}
  .det-res .row{grid-template-columns:minmax(0,1fr);gap:0}
  .cmp col.k{width:132px}
  .cmp th.k{font-size:9.5px}
  .models-home{padding-top:14px}
  .models-intro h1{font-size:24px;white-space:normal}
  .model-controls{grid-template-columns:1fr 1fr;gap:7px}
  .model-search{grid-column:1/-1}
  .model-controls select{width:100%;min-width:0}
  .model-controls label:nth-child(4){grid-column:1/-1}
  .model-count{grid-column:1/-1;padding:0}
  .model-preview{display:none}
  .model-index{grid-row:auto}
  .model-list-head{display:none}
  .model-row{grid-template-columns:minmax(0,1fr) auto;gap:8px;min-height:0;padding:12px 8px}
  .model-id{grid-column:1}
  .model-context{display:flex;grid-column:1}
  .model-floor{grid-column:1;margin-top:5px}
  .model-speed{grid-column:1;margin-top:5px}
  .model-open{grid-column:2;grid-row:1/-1;align-self:center}
  .model-page-baseline>.model-preview-head{display:none}
  .model-page-baseline .baseline-spec{grid-template-columns:minmax(0,1fr)}
  .model-page-baseline .baseline-spec>div.wide{grid-column:auto}
}
@media print{.mast,.rail,.bar,.crail,.foot{display:none}}

ting","capacity_gb":4096,"read_gbs":null,"note":"4 TB per the datasheet; sequential read rate not published"},"thermal":{"tdp_watts":140,"psu_watts":240,"cooling":"active fan","note":"140 W is the GB10 chip TDP (CPU+GPU); 240 W is the system power supply rating"},"sources":[{"url":"https://www.nvidia.com/en-us/products/workstations/dgx-spark/","note":"official specifications: 128 GB LPDDR5x unified, 256-bit, 273 GB/s, 20-core Arm (10x Cortex-X925 + 10x Cortex-A725), up to 1 PFLOP FP4 (sparse), GB10 TDP 140 W, 240 W PSU, 4 TB NVMe M.2"}]},"measured_by_us":true,"url":"https://www.nvidia.com/en-us/products/workstations/dgx-spark/","updated":"2026-09-10"},"gpu-24gb":{"id":"gpu-24gb","name":"24 GB consumer GPU (RTX 3090 / 4090 class)","vendor":"NVIDIA","chip":"GA102 / AD102","arch":"x86_64 host + discrete GPU, sm_86 / sm_89","form_factor":"discrete-gpu","memory_gb":24,"memory_usable_gb":23,"memory_type":"GDDR6X, dedicated VRAM","bandwidth_gbs":936,"bandwidth_range_gbs":[936,1008],"cpu":"host CPU varies","gpu":"24 GB VRAM, 936 GB/s (RTX 3090) to 1008 GB/s (RTX 4090)","notes":["A class entry, not one SKU: 936 GB/s is the RTX 3090 floor, 1008 GB/s the RTX 4090. Setups listed against this class were reported by builders on either card.","Capacity is the binding constraint here, not bandwidth: 24 GB VRAM against 273 GB/s on DGX Spark means small models run much faster on this card and large models do not fit at all.","Nothing above ~24 GB resident fits without CPU offload. Qwen3.8-27B needs a 4-bit quant to stay on-card; BF16 does not fit.","No unified memory, so the disk-mapped embedding-table trick used for 100B+ MoE on Spark has no equivalent path here."],"device":{"identity":{"name":"24 GB consumer GPU (RTX 3090 / 4090 class)","chip":"GA102 / AD102","manufacturer":"NVIDIA","os":null,"form_factor":"discrete-gpu"},"memory":{"total_gb":24,"type":"GDDR6X","bandwidth_gbs":null,"unified":false,"usable_gb":23,"note":"dedicated VRAM on the card; host system RAM is separate and matters only for offload lanes. Class bandwidth spans 936-1008 GB/s; each variant carries its own."},"compute":{"fp32_tflops":35.6,"note":"fp32_tflops at class level is the RTX 3090 floor; the RTX 4090 is 83 TFLOPS (see variants). Ampere (30-series) tensor cores have no native FP8 path — FP8 quantized kernels emulate through FP16 and pay for it; Ada (40-series) has native FP8."},"thermal":{"tdp_watts":350,"cooling":"varies by card model","note":"350 W is the RTX 3090 TGP; the RTX 4090 is 450 W (see variants)"},"variants":[{"id":"rtx-3090","name":"GeForce RTX 3090","chip":"GA102 (Ampere)","memory_configs":"24 GB GDDR6X, 384-bit","bandwidth_gbs":936,"fp32_tflops":35.6,"tdp_watts":350,"note":"no native FP8/FP4 tensor path (Ampere 2nd-gen tensor cores)"},{"id":"rtx-4090","name":"GeForce RTX 4090","chip":"AD102 (Ada Lovelace)","memory_configs":"24 GB GDDR6X, 384-bit","bandwidth_gbs":1008,"fp32_tflops":83,"tensor_ai_tops":1321,"tdp_watts":450,"note":"1321 AI TOPS is NVIDIA's published tensor figure (FP8, with sparsity); dense FP8 TFLOPS not stated separately"}],"sources":[{"url":"https://www.nvidia.com/en-us/geforce/graphics-cards/40-series/rtx-4090/","note":"RTX 4090 official specs: 83 TFLOPS shader, 1321 AI TOPS tensor, 24 GB GDDR6X 384-bit, 450 W TGP"},{"url":"https://videocardz.net/nvidia-geforce-rtx-3090","note":"RTX 3090: 935.8 GB/s (marketing-rounded 936), 350 W, 35.6 TFLOPS FP32, 24 GB GDDR6X 384-bit"}]},"measured_by_us":false,"url":"https://www.nvidia.com/en-us/geforce/graphics-cards/40-series/rtx-4090/","updated":"2026-09-10"},"gpu-multigpu-72gb":{"id":"gpu-multigpu-72gb","name":"Mixed multi-GPU desktop, ~72 GB VRAM (4090D/4090 + 3090s)","vendor":"NVIDIA","chip":"AD102 / GA102 mix","arch":"x86_64 host + 2-3 discrete GPUs, sm_89 / sm_86","form_factor":"discrete-gpu-multi","memory_gb":72,"memory_usable_gb":70,"memory_type":"GDDR6X across 2-3 cards, split by llama.cpp tensor parallelism","bandwidth_gbs":1008,"bandwidth_range_gbs":[936,1008],"cpu":"Xeon W5-3425 class, 256 GB DDR5-4800","gpu":"Reported builds mix 1x RTX 4090D or 4090 with 1-2x RTX 3090; PCIe-lane limited per the builders","notes":["A class entry for the mixed-card rigs builders actually report: total VRAM is the point (72 GB fits a 122B MoE at Q4), not any single card.","Tensor split across cards of different generations means the slowest card's kernels and the PCIe lanes set the ceiling; builders report PCIe-limited prefill.","No unified memory, so MoE expert streaming tricks from Apple Silicon have no equivalent; capacity here is bought with card count.","Numbers recorded against this class always name the exact card mix in the measurement context, because 4090D+3090 and 4090+2x3090 behave differently."],"measured_by_us":false,"url":"https://huggingface.co/unsloth/Qwen3.5-122B-A10B-GGUF/discussions/3","updated":"2026-09-05"},"mac-128gb":{"id":"mac-128gb","name":"Apple Silicon Mac, 128 GB unified (M3 Max / M4 Max class)","vendor":"Apple","chip":"M3 Max / M4 Max","arch":"arm64, Metal","form_factor":"laptop/desktop","memory_gb":128,"memory_usable_gb":121,"memory_type":"unified LPDDR5","bandwidth_gbs":400,"bandwidth_range_gbs":[400,546],"cpu":"Apple M3 Max / M4 Max","gpu":"integrated, shares the 128 GB unified pool","notes":["A class entry, not one SKU: 400 GB/s is the M3 Max, 546 GB/s the M4 Max. Setups listed against this class were reported on either.","Closest structural analogue to DGX Spark — unified memory, so capacity is generous and bandwidth is the limiter — but at roughly 1.5-2x the Spark's 273 GB/s.","Serving path is MLX or llama.cpp/Metal, not SGLang or vLLM: the CUDA-specific forks (DSpark, DFlash2) have no port, so speculative-decoding setups are not comparable across this class and Spark.","Memory pressure is configurable (sysctl iogpu.wired_limit_mb); default GPU wired limit is well below 128 GB, so large MoE builds need it raised.","Ultra chips exist above this class's recorded range (M2 Ultra 800 GB/s, M3 Ultra 819 GB/s — there is no M4 Ultra). A 00 GB/s"}]},"measured_by_us":false,"url":"https://www.apple.com/macbook-pro/","updated":"2026-09-10"},"mac-64gb":{"id":"mac-64gb","name":"Apple Silicon Mac, 32-64 GB unified (M1-M5 Pro/Max class)","vendor":"Apple","chip":"M1-M5 Pro/Max","arch":"arm64, Metal","form_factor":"laptop/desktop","memory_gb":64,"memory_usable_gb":58,"memory_type":"unified LPDDR4x/LPDDR5","bandwidth_gbs":200,"bandwidth_range_gbs":[68,546],"cpu":"Apple Silicon Pro/Max class","gpu":"integrated, shares the unified pool","notes":["A wide class on purpose: 32 GB and 64 GB Macs behave differently, and bandwidth spans 68 GB/s (M1 8-core) to 546 GB/s (M4 Max). Reported numbers name the exact chip in the measurement note.","The binding constraint is RAM, not bandwidth: a 35B MoE at Q4 needs ~22 GB, which a 32 GB Mac runs with almost nothing left for context.","MoE expert streaming from SSD (mlx-flash style) is what makes over-RAM models possible here at a large speed cost."],"device":{"identity":{"name":"Apple Silicon Mac, 32-64 GB unified","chip":"Apple Silicon Pro/Max class","manufacturer":"Apple","os":"macOS","form_factor":"laptop/desktop"},"memory":{"total_gb":64,"type":"LPDDR4x/LPDDR5 (per chip)","bandwidth_gbs":null,"unified":true,"usable_gb":58,"note":"bandwidth is a per-chip property, so the class value stays null here and every variant carries its own; the class spans 68-546 GB/s end to end"},"compute":{"cpu_cores":"Apple Silicon; core counts vary by chip and SKU tier","note":"Apple publishes Neural Engine TOPS but no GPU FLOPS for any M-series chip, so GPU compute stays null. Honest caveat for the MLX lanes: MLX and llama.cpp/Metal primarily drive the GPU; the Neural Engine is largely unused by current local-LLM runtimes, so its TOPS figure must not be read as an inference-throughput promise."},"thermal":{"tdp_watts":null,"cooling":"active fan (laptops, desktops)","note":"Apple does not publish chip TDP; sustained-load behaviour differs between fanless and fan-cooled enclosures"},"variants" sh-Next-oMLX-Recipe","date":"2026-08-31","method":"oMLX recipe runs: dual-252K cold prefill walls, solo decode with MTP, prefix re-promotion","note":"booted idle footprint with the flash oQ4e weights paged in; ~73 GB steady with all 8 HTTP slots resident after orchestrator KV auto-tiers to SSD"},{"metric":"task_time_min","value":8.7,"unit":"s","provenance":"forum","source":"https://github.com/hudsonwa/Qwen3.8-Flash-Next-oMLX-Recipe","date":"2026-08-31","method":"oMLX recipe runs: dual-252K cold prefill walls, solo decode with MTP, prefix re-promotion","note":"re-promoting a 252K prefix from the SSD tier (a self-managed 185.8 GB LRU) vs ~229 s for a full re-prefill on an LRU miss"},{"metric":"decode_chat","value":60.9,"unit":"tok/s","concurrency":1,"provenance":"forum","source":"https://github.com/hudsonwa/Qwen3.8-Flash-Next-oMLX-Recipe","date":"2026-08-31","method":"oMLX recipe runs: dual-252K cold prefill walls, solo decode with MTP, prefix re-promotion","note":"solo decode with MTP speculative decode ON for this checkpoint on this box, vs ~86 tok/s with it off - the measured reason mtp_enabled=false"},{"metric":"task_time_min","value":939,"unit":"s","provenance":"forum","source":"https://github.com/hudsonwa/Qwen3.8-Flash-Next-oMLX-Recipe","date":"2026-08-31","method":"oMLX recipe runs: dual-252K cold prefill walls, solo decode with MTP, prefix re-promotion","note":"27B dense 4x118K per-stream wall spread with chunked prefill OFF (304/1225/1240/1243 s FIFO staircase); with chunked ON the spread is 25.6 s and every stream TTFT ~4 s"},{"metric":"ttft_ms","value":660,"unit":"ms","provenance":"forum","source":"https://github.com/hudsonwa/Qwen3.8-Flash-Next-oMLX-Recipe","date":"2026-08-31","method":"oMLX recipe runs: dual-252K cold prefill walls, solo decode with MTP, prefix re-promotion","note":"worst TTFT across six worker prefills over hot orchestrators (range 0.05-0.66 s, measured prompt_tokens 30,585 TDD and 61,089 coder/auditor)"},{"metric":"memory_gb","value":9.25,"unit":"GB","provenance":"forum","source":"https://github.com/hudsonwa/Qwen3.8-Flash-Next-oMLX-Recipe","date":"2026-08-31","method":"oMLX recipe runs: dual-252K cold prefill walls, solo decode with MTP, prefix re-promotion","note":"KV slot rate per ~252K orchestrator slot (~1.2 GB per 32K slot, ~2.3 GB per 64K slot); static worst case with nothing tiered ~97-99 GB"},{"metric":"task_time_min","value":11.26,"unit":"s","provenance":"forum","source":"https://github.com/hudsonwa/Qwen3.8-Flash-Next-oMLX-Recipe","date":"2026-08-31","method":"oMLX recipe runs: dual-252K cold prefill walls, solo decode with MTP, prefix re-promotion","note":"longest observed memory-planner tick during the W1 dual fill (the pair was 11.26 s and 1.12 s; range across the box ~1-25 s)"}],"caveats":["This is oMLX, not stock mlx-lm: the runtime carries the qwen4_exp/PLE paging that stock MLX lacks, so the recipe is runtime-specific.","Cold-fill walls (483.6 s for dual ~252K) are the price of the SSD tier; warm re-promotion at 8.7 s is the number that makes the lane usable.","The builder repo tags its own license as 'other'; the weights lineage is Qwen Apache-2.0.","Builder runtimes carry their own terms on top of the weights (Mia's scripts are AGPL-3.0)."],"provenance_tier":"forum","sources":[{"url":"https://github.com/hudsonwa/Qwen3.8-Flash-Next-oMLX-Recipe","kind":"repo","note":"the oMLX recipe and measured walls"},{"url":"https://huggingface.co/RadixArk/Qwen3.8-Flash-Next-NVFP4","kind":"model","note":"source weights"}],"updated":"2026-09-05","builder":"hudsonwa"},{"id":"qwen38-flash-next-mia-vllm-spark","title":"Qwen3.8-Flash-Next 180B — Mia's single-Spark vLLM build","slug_note":"The reference single-box 180B recipe. 99GB resident plus a 27GB embedding lookup table memory-mapped from disk, vision verified on, and a 400K-context stress test passed.","model":"qwen3-8-flash-next","status":"reported","variation":{"checkpoint":"Mia-AiLab/Qwen3.8-Flash-Next-NVFP4","publisher":"mia-ai-lab","quant":"nvfp4","quant_detail":"99GB re-zip of the model with the 51GB PLE lookup table split out to a 27GB disk-resident file, mmap'd with MADV_RANDOM and fetched line by line. FP8 KV cache notes on by default.","format":"safetensors","size_gb":126,"url":"https://github.com/MiaAI-Lab/Qwen3.8-Flash-Next-Single-DGX-Spark","license":"Apache-2.0","downloads":null},"engine":{"id":"vllm","config":"vLLM tensor-parallel 1, FP8 KV notes default, MTP-3 speculative decoding, 262144 native context with YARN=1 reaching 524288. Host-side memory budget: 26GB reserve plus a watchdog.","image":"vllm/vllm-openai:qwen38-flash-next","requires_fork":true,"draft_model":"in-checkpoint MTP head (4B)","spec_decode":"mtp","flags":["--tensor-parallel-size 1","--max-model-len 262144"]},"hardware":["dgx-spark"],"requirements":{"memory_gb":99,"disk_gb":126,"min_vram_gb":null,"notes":"99GB resident + 27GB table on disk + 26GB host reserve. About 15GB of headroom left on a 128GB box — mem-fraction pinned to 0.78 and concurrency capped at 4."},"capabilities":{"vision":true,"video":true,"tools":true,"thinking":true,"long_context":262144,"max_context":524288},"run":{"command":"cp .env.sample .env && ./download.sh && ./start.sh","repo":"https://github.com/MiaAI-Lab/Qwen3.8-Flash-Next-Single-DGX-Spark","profile":"profiles/qwen3.8-flash-next-mia.env","steps":[{"kind":"do","text":"git clone the repo"},{"kind":"cmd","text":"cp .env.sample .env"},{"kind":"cmd","text":"./download.sh"},{"kind":"cmd","text":"./start.sh"}],"auto_bootable":false},"measurements":[{"metric":"decode_per_stream","value":37,"unit":"tok/s","concurrency":1,"provenance":"forum","date":"2026-09-04","n":null,"method":null,"note":"Single stream. Builder-reported.","source":"https://github.com/MiaAI-Lab/Qwen3.8-Flash-Next-Single-DGX-Spark"},{"metric":"decode_agg","value":86,"unit":"tok/s","concurrency":4,"provenance":"forum","date":"2026-09-04","n":null,"method":null,"note":"Aggregate at 4 concurrent streams.","source":"https://github.com/MiaAI-Lab/Qwen3.8-Flash-Next-Single-DGX-Spark"}],"caveats":["Manual-only lane: our start-model.sh refuses to auto-boot ENGINE=vllm cards. Bring the server up from the builder's repo, then point the profile's PORT at it with auto=false to benchmark it.","Prefill reads 1500-2000 tok/s per the builder. Reading is cheap here; writing is the bottleneck.","The repo scripts are AGPL, which is a different license from the Apache-2.0 weights. Check both before shipping anything.","At 99GB resident with a 26GB host reserve, this build has roughly 15GB of slack. Context length and concurrency both have to stay tuned down.","Mia's serving scripts are AGPL-3.0 while the weights are apache-2.0; the license field records the weights."],"provenance_tier":"forum","sources":[{"url":"https://github.com/MiaAI-Lab/Qwen3.8-Flash-Next-Single-DGX-Spark","kind":"repo","note":"the build"},{"url":"https://github.com/MiaAI-Lab/Qwen3.8-27B-SGLang-DGX-Spark","kind":"repo","note":"our profile card + teardown notes"}],"updated":"2026-09-05","builder":"mia-ai-lab"},{"id":"qwen38-flash-next-orcarouter-gguf-uncensored","title":"Qwen3.8-Flash-Next 180B — OrcaRouter uncensored GGUF (SSD sidecar)","slug_note":"The uncensored lane, and the fastest reading throughput anywhere in the directory: 489 tok/s prefill, 28.7 tok/s decode, vision on, 256K context. It needs a custom Rust engine fork.","model":"qwen3-8-flash-next","status":"reported","variation":{"checkpoint":"Baekpica/Qwen3.8-Flash-Next-Uncensored-Mixed-Quant-SSD-PLE-GGUF","publisher":"orcarouter","quant":"gguf-q4","quant_detail":"Mixed-quant GGUF with the PLE embedding table split to an SSD sidecar. ~110GB plus the sidecar. Gated download.","format":"gguf","size_gb":110,"url":"https://huggingface.co/Baekpica","license":"Apache-2.0","downloads":null},"engine":{"id":"custom-fork","config":"ds4-dfm-rs, the builder's own Rust engine fork. Not SGLang or vLLM compatible — these weights will not load in a stock engine.","image":null,"requires_fork":true,"draft_m   h += '<div class="sec"><' + H + '>Tested hardware</' + H + '><div class="kv">' + (s.hardware || []).map(function (id) {
    var hw = HW[id] || {};
    var bits = [gb(hw.memory_gb) || "memory not recorded"];
    if (hw.bandwidth_gbs) bits.push(hw.bandwidth_gbs + " GB/s");
    else if (hw.bandwidth_range_gbs) bits.push(hw.bandwidth_range_gbs[0] + "–" + hw.bandwidth_range_gbs[1] + " GB/s");
    if (hw.arch) bits.push(hw.arch);
    bits.push(hw.measured_by_us ? "measured by the owner" : "not measured by the owner");
    return "<dt>" + esc(hw.name || id) + "</dt><dd>" + esc(bits.join(" · ")) + "</dd>";
  }).join("") + "</div></div>";

  h += '<div class="sec"><' + H + '>Measurements <span class="g">' +
    esc(plural((s.measurements || []).length, "record")) + "</span></' + H + '>" + measurementTable(s) + aggNote(s) + "</div>";

  h += '<div class="sec"><' + H + '>Capability support</' + H + '>' + capLine(s) + "</div>";

  if (fails.length) h += '<div class="sec"><' + H + ' style="color:var(--bad)">' + esc("✕ Known failures") +
    '</' + H + '><ul class="notes bad">' + fails.map(function (c) { return "<li>" + esc(c) + "</li>"; }).join("") + "</ul></div>";
  if (cav.length) h += '<div class="sec"><' + H + '>Caveats <span class="g">' + esc("— what these numbers do not mean") +
    '</span></' + H + '><ul class="notes warn">' + cav.map(function (c) { return "<li>" + esc(c) + "</li>"; }).join("") + "</ul></div>";
  var got = (ENG[e.id] || {}).gotchas || [];
  if (got.length) h += '<div class="sec"><' + H + '>Engine gotchas <span class="g">' + esc((ENG[e.id] || {}).name || e.id) +
    '</span></' + H + '><ul class="notes">' + got.map(function (c) { return "<li>" + esc(c) + "</li>"; }).join("") + "</ul></div>";

  h += '<div class="sec"><' + H + '>Sources and revision</' + H + '>' + sourcesHtml(s) +
    '<p class="prose" style="margin-top:7px">' + esc("Last updated " + (s.updated || "—") + " · " + freshness(s).word +
      " · status: " + (s.status || "unrecorded")) + "</p>";
  if (!opts.page) h += "</div>";
  else h += '<details class="rawjson"><summary>Raw JSON</summary><pre>' + esc(JSON.stringify(s, function (k, v2) { return k.indexOf("__") === 0 ? undefined : v2; }, 2)) + "</pre>" +
    copyBtn(JSON.stringify(s, function (k, v2) { return k.indexOf("__") === 0 ? undefined : v2; }, 2), "copy JSON") + "</details></div>";

  if (!opts.page) {
    h += '<div class="det-foot"><a class="btn" href="#/recipes/' + esc(s.id) + '">Open recipe page →</a>' +
      '<button type="button" class="btn" data-cmp="' + esc(s.id) + '">' +
      (state.compare.indexOf(s.id) >= 0 ? "Remove from compare" : "Add to compare") + "</button></div>";
  }
  return h;
}

/* --------------------------------------------------------------- the row */
function decodeCell(s) {
  var r = repDecode(s);
  if (r) {
    return '<span class="dec-v">' + esc(r.value) + '<span class="dec-u">' + esc(r.unit) + "</span></span>" +
      '<div class="l2">' + esc(condOf(r)) + "</div>";
  }
  var a = aggDecode(s);
  if (a) {
    return '<span class="dec-v">' + esc(a.value) + '<span class="dec-u">' + esc(a.unit) + "</span></span>" +
      '<div class="l2"><span class="warn">' + esc("▲ aggregate only") + "</span> " + esc(condOf(a)) + "</div>";
  }
  return '<span class="na">' + esc("no speed data") + "</span>";
}
function artifactCell(s) {
  var v = s.variation || {}, confl = capConflicts(s), fails = failures(s);
  var l2 = [esc(pubName(v.publisher))];
  if (v.quant_detail) l2.push(esc(String(v.quant_detail).split(".")[0]));
  var extra = "";
  if (confl.length) extra += ' <span class="bad">' + esc("✕ " + confl.join(", ") + " off (runtime)") + "</span>";
  else if (fails.length) extra += ' <span class="bad">' + esc("✕ " + fails[0].slice(0, 88) + (fails[0].length > 88 ? "…" : "")) + "</span>";
  else if ((s.caveats || []).length) extra += ' <span class="warn">' + esc("▲ " + plural(s.caveats.length, "caveat")) + "</span>";
  return '<div class="l1 mono">' + esc(tail(v.checkpoint)) + "</div>" +
    '<div class="l2 clamp">' + l2.join(" · ") + extra + "</div>";
}
function hwCell(s) {
  var ids = s.hardware || [];
  if (!ids.length) return na();
  var first = (HW[ids[0]] || {}).name || ids[0];
  var need = gb((s.requirements || {}).memory_gb);
  var l2 = (need ? "needs " + need : "requirement not recorded") + (ids.length > 1 ? " · +" + (ids.length - 1) : "");
  return '<div class="l1 clamp" style="font-weight:400;font-size:13px">' + esc(String(first).split(",")[0]) + "</div>" +
    '<div class="l2">' + esc(l2) + "</div>";
}
function readyCell(s) {
  var k = readiness(s);
  return '<div class="l1" style="font-weight:400;font-size:13px">' + esc(READY_GLYPH[k] + " " + READY_WORD[k]) + "</div>" +
    '<div class="l2">' + esc(complexityWord(s)) + "</div>";
}
function engineCell(s) {
  var e = s.engine || {};
  return '<div class="l1" style="font-weight:400;font-size:13px">' + esc((ENG[e.id] || {}).name || e.id) +
    (e.requires_fork ? ' <span style="color:var(--warn)">' + esc("⤴") + "</span>" : "") + "</div>" +
    '<div class="l2">' + esc(e.requires_fork ? "custom fork" : "stock") +
    (e.spec_decode && e.spec_decode !== "none" ? esc(" · " + e.spec_decode) : "") + "</div>";
}

function rowTr(s) {

      '<div class="l2">' + esc(v.format) + " · " + esc(gb(v.size_gb) || "size ?") + "</div></td>" +
    '<td class="c-eng">' + engineCell(s) + "</td>" +
    '<td class="c-hw">' + hwCell(s) + "</td>" +

function rowLi(s) {

/* ------------------------------------------------------------- the shelf */
function shelfHead(mid, shown, total) {
  var m = MODELS[mid] || {}, a = m.architecture || {}, c = m.context || {};
  var all = SETUPS.filter(function (s) { return s.model === mid; });
  var measured = all.filter(function (s) { return speeds(s).length > 0; }).length;
  var upd = all.map(function (s) { return s.updated; }).sort().pop();
  function fld(label, val) {
    return "<div><span class=\"lbl\">" + esc(label) + '</span><span class="v">' + (val == null ? na() : val) + "</span></div>";
  }
  var active = a.params_active_b != null ? esc(a.params_active_b + "B")
    : (a.kind === "dense" ? esc("all — dense") : null);
  var h = '<div class="shelf-head"><div class="shelf-top"><h2 id="h-' + esc(mid) + '">' +
    '<a href="#/models/' + esc(mid) + '">' + esc(m.name || mid) + "</a></h2>" +
    '<span class="shelf-meta"><b>' + esc(shown === total ? plural(total, "recipe") : shown + " of " + total + " recipes") +
    "</b> · " + esc(measured + " measured") + " · " + esc("updated " + (upd || "—")) + "</span></div>" +
    '<div class="spec">' +
    fld("Generation", esc(m.generation || "")) +
    fld("Architecture", esc(a.kind === "moe" ? "MoE" : a.kind || "")) +
    fld("Total params", a.params_total_b != null ? esc(a.params_total_b + "B") : null) +
    fld("Active params", active) +
    fld("Native context", c.native != null ? '<span class="mono">' + esc(ctx(c.native)) + "</span>" : na("unstated by the publisher")) +
    fld("Max context", c.max != null ? '<span class="mono">' + esc(ctx(c.max)) + "</span>" : na("not stated")) +
    fld("Modalities", esc((m.modalities || []).join(" · "))) +
    fld("Weight license", esc(m.license || "")) +
    "</div>";
  if ((m.known_regressions || []).length) {
    h += '<details class="regr"><summary>' + esc("▲ " + plural(m.known_regressions.length, "known regression")) +
      " in this family</summary><ul>" + m.known_regressions.map(function (r) { return "<li>" + esc(r) + "</li>"; }).join("") + "</ul></details>";
  }
  return h + "</div>";
}

  });
  return '<label class="fsel' + (cur ? " on" : "") + '"><span>' + esc(FACETS[key].label) +
    '</span><select id="' + esc(id) + '" data-f="' + esc(key) + '" aria-label="' +
    esc("Filter by " + FACETS[key].label.toLowerCase()) + '">' + o + "</select></label>";
}

        }).join("") + "</select></label>";
    });
    h += '<div class="fld"><span class="lbl">Total parameters (B)</span><div class="range">' +

  var h = '<div class="empty"><h2>' + esc("No recipes match " + (state.q ? "that search and " : "") + plural(activeFilters().length, "filter") + ".") + "</h2>";
  if (state.q) h += "<p>" + esc("Searched model, family, checkpoint, publisher, builder, engine, configuration, quantization, command, step text, caveats and measurement methods for: ") +
    '<span class="mono">' + esc(state.q) + "</span></p>";
  if (sug.length) h += "<p>" + sug.slice(0, 3).map(esc).join("<br>") + "</p>";
  h += '<div class="acts"><button type="button" class="btn btn-p" id="clear-all">Clear all filters</button>' +
    '<a class="btn" href="#/methodology">What the fields mean</a></div></div>';

}

/* ------------------------------------------------------------- detection */
function detectMachine(cb) {
  var got = {}, notes = [], done = 0, expect = 1;
  var nav = navigator;
  var uad = nav.userAgentData;
  var plat = (uad && uad.platform) || nav.platform || "";
  if (/mac/i.test(plat)) got.os = "macos";
  else if (/win/i.test(plat)) got.os = "windows";
  else if (/linux|x11/i.test(plat)) got.os = "linux";
  if (got.os) notes.push(["Platform", got.os, "from navigator.userAgentData"]);
  else notes.push(["Platform", "not detectable", "the browser does not expose it"]);

  if (nav.hardwareConcurrency) notes.push(["CPU threads", String(nav.hardwareConcurrency), "logical cores, from navigator.hardwareConcurrency — not the chip name"]);
  else notes.push(["CPU threads", "not detectable", "navigator.hardwareConcurrency unavailable"]);

  if (nav.deviceMemory) notes.push(["RAM", nav.deviceMemory + " GB reported", "navigator.deviceMemory rounds down to a power of two and caps at 8 — enter your real figure below"]);
  else notes.push(["RAM", "not detectable", "navigator.deviceMemory is Chromium-only — enter it yourself"]);

  var gl = null;
  try {
    var c = document.createElement("canvas");
    gl = c.getContext("webgl") || c.getContext("experimental-webgl");
    if (gl) {
      var ext = gl.getExtension("WEBGL_debug_renderer_info");
      var r = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
      if (r) { got.gpu = String(r); notes.push(["GPU", got.gpu, "from the WebGL renderer string — often masked for fingerprinting reasons"]); }
    }
  } catch (e) { /* blocked contexts are expected */ }
  if (!got.gpu) notes.push(["GPU", "not detectable", "the WebGL renderer string is masked or unavailable"]);

  notes.push(["VRAM · free disk · driver · runtime · power limit", "not detectable", "no browser API exposes these — they are always manual"]);

  function finish() {
    done++;
    if (done >= expect) cb(got, notes);
  }
  var timer = setTimeout(function () { expect = 0; cb(got, notes); }, 2000);
  if (nav.gpu && nav.gpu.requestAdapter) {
    nav.gpu.requestAdapter().then(function (ad) {
      try {
        var info = ad && (ad.info || (ad.requestAdapterInfo ? null : null));
        if (info && (info.vendor || info.architecture)) {
          var t = [info.vendor, info.architecture, info.description].filter(Boolean).join(" ");
          if (t.trim()) { got.gpu = got.gpu || t; notes.push(["WebGPU adapter", t, "from navigator.gpu adapter info"]); }
        } else notes.push(["WebGPU adapter", "masked", "the browser exposes no adapter vendor or architecture"]);
      } catch (e) { notes.push(["WebGPU adapter", "masked", "adapter info unavailable"]); }
      clearTimeout(timer); if (expect) finish();
    }, function () {
      notes.push(["WebGPU adapter", "unavailable", "no WebGPU adapter could be requested"]);
      clearTimeout(timer); if (expect) finish();
    });
  } else {
    notes.push(["WebGPU adapter", "unavailable", "navigator.gpu is not present in this browser"]);
    clearTimeout(timer); finish();
  }
}

function parseHash() {
  var h = location.hash.replace(/^#/, "") || "/";
  var qi = h.indexOf("?");
  var path = qi < 0 ? h : h.slice(0, qi);
  var qs = qi < 0 ? "" : h.slice(qi + 1);
  var q = {};
  qs.split("&").forEach(function (kv) {
    if (!kv) return;
    var i = kv.indexOf("=");
    var k = decodeURIComponent(i < 0 ? kv : kv.slice(0, i));
    q[k] = decodeURIComponent((i < 0 ? "" : kv.slice(i + 1)).replace(/\+/g, " "));
  });
  var parts = path.replace(/^\/+|\/+$/g, "").split("/").filter(Boolean);
  return { parts: parts, q: q };
}
function writeHash() {
  if (state.route !== "directory") return;
  var q = [];
  if (state.q) q.push("q=" + encodeURIComponent(state.q));
  Object.keys(state.f).forEach(function (k) { if (state.f[k]) q.push(k + "=" + encodeURIComponent(state.f[k])); });
  if (state.sort !== "updated") q.push("sort=" + state.sort);
  if (state.adv) q.push("adv=1");
  var next = "#/recipes" + (q.length ? "?" + q.join("&") : "");
  if (location.hash !== next) history.replaceState(null, "", next);
}
function route() {
  var r = parseHash(), p = r.parts;
  var name = p.length === 0 ? "models-home" : p[0];
  state.route = name === "models-home" ? "models-home" : name === "recipes" ? (p[1] ? "recipe" : "directory") :
    ({ hardware: "hardware", compare: "compare", models: "model", publishers: "publisher",
      methodology: "methodology", contribute: "contribute" }[name] || "404");
  if (state.route === "models-home") {
    state.modelQ = r.q.q || "";
    state.modelGen = r.q.gen || "";
    state.modelArch = r.q.arch || "";
    state.modelBaseline = r.q.baseline === "selected" || r.q.baseline === "missing" ? r.q.baseline : "";
    state.selectedModel = MODELS[r.q.model] ? r.q.model : state.selectedModel;
  }
  if (state.route === "directory") {
    state.q = r.q.q || "";
    state.sort = SORTS[r.q.sort] ? r.q.sort : "updated";
    state.adv = r.q.adv === "1";
    state.f = {};
    Object.keys(r.q).forEach(function (k) {
      if (FACETS[k] || k === "pmin" || k === "pmax") state.f[k] = r.q[k];
      if (FACETS[k] || k === "pmin" || k === "pmax") { if (ADVANCED.indexOf(k) >= 0 || k === "pmin" || k === "pmax") state.adv = true; }
    });
  }
  if (state.route === "compare" && r.q.sel) {
    state.compare = r.q.sel.split(",").filter(function (id) {
      return SETUPS.some(function (s) { return s.id === id; });
    }).slice(0, CMP_MAX);
    sess("qlr.compare", state.compare);
  }
  document.querySelectorAll(".tab").forEach(function (t) {
    var active = state.route === "model" || state.route === "models-home" ? "models-home" :
      state.route === "recipe" || state.route === "directory" ? "directory" : state.route;
    var on = t.getAttribute("data-route") === active;
    if (on) t.setAttribute("aria-current", "page"); else t.removeAttribute("aria-current");
  });
  document.body.setAttribute("data-route", state.route);
  el("shell").style.gridTemplateColumns = state.route === "directory" && !state.mobile && window.innerWidth >= 1180
    ? "var(--rail-w) minmax(0,1fr)" : "minmax(0,1fr)";

  if (state.route === "models-home") viewModelsHome();
  else if (state.route === "directory") { viewDirectory(); writeHash(); }
  else if (state.route === "hardware") viewHardware();
  else if (state.route === "compare") viewCompare();
  else if (state.route === "recipe") viewRecipe(p[1]);
  else if (state.route === "model") viewModel(p[1]);
  else if (state.route === "publisher") viewPublisher(p[1]);
  else if (state.route === "methodology") viewMethodology();
  else if (state.route === "contribute") viewContribute();
  else notFound("The route “" + location.hash + "” does not exist in this directory.");

  window.scrollTo(0, 0);
}
function setRail(html) { var r = el("rail"); r.innerHTML = html; r.hidden = !html; }
function announce(msg) { var l = el("live"); if (l) l.textContent = msg; }

/* ---------------------------------------------------------------- events */
function nav(hash) { if (location.hash === hash) route(); else location.hash = hash; }
function setFilter(k, v) {
  if (v) state.f[k] = v; else delete state.f[k];
  writeHash(); viewDirectory();
}
var qTimer = null;
document.addEventListener("input", function (e) {
  var t = e.target;
  if (t.id === "q") {
    clearTimeout(qTimer);
    qTimer = setTimeout(function () {
      var pos = t.selectionStart;
      state.q = t.value;
      writeHash(); viewDirectory();
      var nq = el("q");
      if (nq) { nq.focus(); try { nq.setSelectionRange(pos, pos); } catch (err) {} }
    }, 130);
  }
  if (t.id === "model-q") {
    clearTimeout(qTimer);
    qTimer = setTimeout(function () {
      var pos = t.selectionStart;
      state.modelQ = t.value;
      viewModelsHome();
      var nq = el("model-q");
      if (nq) { nq.focus(); try { nq.setSelectionRange(pos, pos); } catch (err) {} }
    }, 130);
  }
  if (t.getAttribute("data-hwf")) {
    var k = t.getAttribute("data-hwf");

    var v = t.value;
    state.profile[k] = (t.type === "number") ? (v === "" ? null : Number(v)) : v;
    if (k === "ramGb" || k === "vramGb" || k === "os" || k === "unified" || k === "chip" || k === "gpu" || k === "gpuCount") {
      clearTimeout(qTimer);
      qTimer = setTimeout(function () { var a = document.activeElement && document.activeElement.id; viewHardware(); var n = a && el(a); if (n) n.focus(); }, 320);
    }
  }
});
document.addEventListener("change", function (e) {
  var t = e.target, f = t.getAttribute("data-f");
  if (t.id === "model-gen") { state.modelGen = t.value; viewModelsHome(); return; }
  if (t.id === "model-arch") { state.modelArch = t.value; viewModelsHome(); return; }
  if (t.id === "model-baseline") { state.modelBaseline = t.value; viewModelsHome(); return; }
  if (f) { setFilter(f, t.value); return; }
  if (t.id === "f-pmin") { setFilter("pmin", t.value); return; }
  if (t.id === "f-pmax") { setFilter("pmax", t.value); return; }
  if (t.id === "sort") { state.sort = t.value; writeHash(); viewDirectory(); return; }
  if (t.id === "hw-known") {
    var id = t.value;
    if (!id) return;
    var hw = HW[id];
    state.profile = blankProfile();
    state.profile.deviceId = id;
    state.profile.name = hw.name;
    state.profile.ramGb = hw.memory_gb;
    state.profile.chip = hw.chip || "";
    state.profile.gpu = hw.gpu || "";
    state.profile.unified = /unified/i.test(hw.memory_type || "") ? "unified" : "separate";
    state.profile.os = /Metal/i.test(hw.arch || "") ? "macos" : "linux";
    state.profile.gpuCount = /multi/i.test(hw.form_factor || "") ? 2 : 1;
    viewHardware();
    return;
  }
  if (t.id === "as-ctx") { state.assume.context = Number(t.value); viewHardware(); return; }
  if (t.id === "as-conc") { state.assume.concurrency = Number(t.value); viewHardware(); return; }
  if (t.id === "as-res") { state.assume.reserve = t.value === "" ? null : Number(t.value); viewHardware(); return; }
  var cmp = t.getAttribute("data-cmp");
  if (cmp && t.type === "checkbox") {
    if (!toggleCompare(cmp)) { t.checked = false; return; }
    document.querySelectorAll('[data-cmp="' + cmp + '"]').forEach(function (n) {
      if (n.type === "checkbox") n.checked = state.compare.indexOf(cmp) >= 0;
    });
    var row = document.querySelector('[data-row="' + cmp + '"]');
    if (row) row.classList.toggle("sel-on", state.compare.indexOf(cmp) >= 0);
  }
});
document.addEventListener("click", function (e) {
  var t = e.target.closest ? e.target.closest("[data-exp],[data-copy],[data-clear],[data-rail-f],[data-rail-clear],[data-jump],[data-cmp],[data-ev],[data-grp],[data-goal],[data-load],[data-model-select],#model-clear,#clear-all,#adv-toggle,#cmp-clear,#theme,#hw-detect,#hw-save,#hw-clear,#hw-export,#hw-import") : null;
  if (!t) {
    hidePop();
    /* Clicking anywhere on a row header toggles it — the expander triangle is
       the keyboard affordance, but pointer users expect the whole row to be
       the target. Interactive children (compare checkbox, buttons, links,
       evidence popovers) and the open detail panel are excluded. */
    var rowEl = e.target.closest ? e.target.closest("[data-row]") : null;
    if (rowEl && !e.target.closest("input,button,a,select,textarea,label,.det-in")) {
      var rid = rowEl.getAttribute("data-row");
      if (state.expanded[rid]) delete state.expanded[rid]; else state.expanded[rid] = 1;
      rerenderRow(rid);
    }
    return;
  }

  if (t.id === "theme") {
    var cur = document.documentElement.getAttribute("data-theme");
    var next = cur === "dark" ? "light" : cur === "light" ? "" : "dark";
    if (next) document.documentElement.setAttribute("data-theme", next);
    else document.documentElement.removeAttribute("data-theme");
    store("qlr.theme", next);
    return;
  }
  var modelSelect = t.getAttribute("data-model-select");
  if (modelSelect) {
    if (state.mobile) { nav("#/models/" + modelSelect); return; }
    state.selectedModel = modelSelect;
    viewModelsHome();
    var selected = document.querySelector('[data-model-select="' + modelSelect + '"]');
    if (selected) selected.focus();
    return;
  }
  if (t.id === "model-clear") {
    state.modelQ = ""; state.modelGen = ""; state.modelArch = ""; state.modelBaseline = "";
    viewModelsHome(); return;
  }
  if (t.id === "m-filters") { state.filtersOpen = !state.filtersOpen; viewDirectory(); return; }
  if (t.id === "adv-toggle") { state.adv = !state.adv; writeHash(); viewDirectory(); return; }
  if (t.id === "clear-all") { state.f = {}; state.q = ""; writeHash(); viewDirectory(); return; }
  if (t.id === "cmp-clear") { state.compare = []; sess("qlr.compare", []); renderRail(); route(); return; }

  var clear = t.getAttribute("data-clear");
  if (clear) { if (clear === "q") state.q = ""; else delete state.f[clear]; writeHash(); viewDirectory(); return; }

  if (t.getAttribute("data-rail-clear")) { state.f = {}; writeHash(); viewDirectory(); return; }
  var rf = t.getAttribute("data-rail-f");
  if (rf) {
    var rv = t.getAttribute("data-rail-v");

    if (rf !== "arch") delete state.f.arch;
    if (rf !== "cap") delete state.f.cap;

    return;
  }
  var jump = t.getAttribute("data-jump");

    return;

    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(cp).then(function () { done(true); }, function () { done(false); });
    else done(false);

  if (t.id === "hw-detect") {
    var out = el("hw-detect-out");
    out.innerHTML = '<p class="det-line">' + esc("detecting…") + "</p>";
    detectMachine(function (got, notes) {
      if (!state.profile) state.profile = blankProfile();
      Object.keys(got).forEach(function (k) { state.profile[k] = got[k]; state.profile.detected[k] = true; });
      state.profile.__notes = notes;
      viewHardware();
      var o = el("hw-detect-out");
      if (o) o.innerHTML = '<div class="det-res">' + notes.map(function (n) {
        return '<div class="row"><span class="lbl">' + esc(n[0]) + "</span><span>" +
          (/not detectable|masked|unavailable/.test(n[1]) ? '<span class="na">' + esc(n[1]) + "</span>" : "<b>" + esc(n[1]) + "</b>") +
          '<br><span class="g">' + esc(n[2]) + "</span></span></div>";
      }).join("") + "</div>";
    });
    return;
  }

    arr2 = arr2.filter(function (x) { return x.name !== state.profile.name; });
    arr2.push(JSON.parse(JSON.stringify(state.profile, function (k, v) { return k.indexOf("__") === 0 ? undefined : v; })));
    if (store("qlr.profiles.v2", arr2) === null && !window.localStorage) announce("Profiles cannot be saved in this browser.");
    store("qlr.profile.current", state.profile);

    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt);
    var o2 = el("hw-detect-out");
    if (o2) o2.innerHTML = '<div class="privacy"><b>Profile JSON</b> (copied to the clipboard where the browser allows it)<pre style="white-space:pre-wrap;margin-top:6px">' + esc(txt) + "</pre></div>";
    return;
  }

      '<textarea id="hw-import-ta" rows="4" style="width:100%;font:450 11.5px var(--font-mono)"></textarea></label>' +

document.addEventListener("click", function (e) {
  if (e.target.id !== "hw-import-go") return;

  } catch (err) { announce("That is not valid profile JSON."); }
});
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") {
    if (!el("pop").hidden) { hidePop(); return; }
    var open = e.target.closest && e.target.closest(".det-in");
    if (open) {
      var row = open.closest("[data-row]") || open.closest("tr").previousElementSibling;
      var id = row && (row.getAttribute("data-row") || (row.querySelector("[data-exp]") || {}).getAttribute && row.querySelector("[data-exp]").getAttribute("data-exp"));
      if (id) { delete state.expanded[id]; rerenderRow(id); var b = document.querySelector('[data-exp="' + id + '"]'); if (b) b.focus(); }
    }
  }
});
document.addEventListener("focusout", function (e) {
  if (e.target.getAttribute && e.target.getAttribute("data-ev")) setTimeout(hidePop, 60);
});

function rerenderRow(id) {
  // Re-render just the shelf containing the row, so scroll position is kept.
  var node = document.querySelector('[data-row="' + id + '"]');
  if (!node) { route(); return; }
  var s = SETUPS.filter(function (x) { return x.id === id; })[0];
  if (state.mobile) {
    var li = document.createElement("li");
    li.innerHTML = rowLi(s);
    node.replaceWith(li.firstElementChild);
  } else {
    var tb = node.parentNode, tmp = document.createElement("tbody");
    tmp.innerHTML = rowTr(s);
    var next = node.nextElementSibling;
    if (next && next.classList.contains("det")) next.remove();
    var frag = document.createDocumentFragment();
    while (tmp.firstChild) frag.appendChild(tmp.firstChild);
    tb.replaceChild(frag, node);
  }
  var btn = document.querySelector('[data-exp="' + id + '"]');
  if (btn) btn.focus();
  renderRail();
}

/* popover for the evidence strip */
function showPop(anchor, id) {
  var s = SETUPS.filter(function (x) { return x.id === id; })[0];
  if (!s) return;
  var c = conf(s), pop = el("pop");
  pop.innerHTML = "<b>" + esc("Evidence for this recipe") + "</b><dl>" + DIMS.map(function (d) {
    var v = c[d[0]], l = LV[v.k];
    return "<dt>" + esc(d[1]) + '</dt><dd><span class="' + l.cls + '">' + esc(l.g + " " + v.t) + "</span><br>" +
      '<span class="g">' + esc(v.why) + "</span></dd>";
  }).join("") + "</dl>";
  pop.hidden = false;
  var r = anchor.getBoundingClientRect();
  var w = Math.min(320, window.innerWidth - 16);
  pop.style.width = w + "px";
  var left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8));
  pop.style.left = left + "px";
  var top = r.bottom + 6;
  if (top + pop.offsetHeight > window.innerHeight - 8) top = Math.max(8, r.top - pop.offsetHeight - 6);
  pop.style.top = top + "px";
}
function hidePop() { var p = el("pop"); if (p) p.hidden = true; }
document.addEventListener("mouseover", function (e) {
  var t = e.target.closest && e.target.closest("[data-ev]");
  if (t) showPop(t, t.getAttribute("data-ev"));
});
document.addEventListener("scroll", function () { hidePop(); spy(); }, true);

/* scroll-spy on the family rail */
var spyTimer = null;
function spy() {
   if (state.route !== "directory" || state.mobile) return;
  clearTimeout(spyTimer);
  spyTimer = setTimeout(function () {
    var best = null, bestTop = Infinity;
    document.querySelectorAll(".shelf").forEach(function (sec) {
      var t = sec.getBoundingClientRect().top;
      if (t <= 160 && t > -sec.offsetHeight) { if (Math.abs(t) < bestTop) { bestTop = Math.abs(t); best = sec.id; } }
    });
    document.querySelectorAll("[data-jump]").forEach(function (a) {
      if (a.getAttribute("data-jump") === best) a.setAttribute("data-spy", "1"); else a.removeAttribute("data-spy");
    });
  }, 90);
}

/* ------------------------------------------------------------------ boot */
(function boot() {
  var th = store("qlr.theme");
  if (th) document.documentElement.setAttribute("data-theme", th);
  var saved = sess("qlr.compare");
  if (Array.isArray(saved)) state.compare = saved.filter(function (id) { return SETUPS.some(function (s) { return s.id === id; }); }).slice(0, CMP_MAX);
  var prof = store("qlr.profile.current");
  if (prof) state.profile = prof;

  // Path shim: keep the documented paths working if the site ever moves to a
  // host with directory rewrites. ifhost serves exactly one file at /.
  if (/^https?:$/.test(location.protocol)) {
    var pn = location.pathname.replace(/\/index\.html$/, "");
    var m = pn.match(/\/(hardware|compare|methodology|contribute|models\/[^/]+|recipes(?:\/[^/]+)?|publishers\/[^/]+)\/?$/);
    if (m && !location.hash) { location.replace(location.origin + "/#/" + m[1]); return; }
  }

  el("gen").textContent = D.generated;
  MOBILE.addEventListener ? MOBILE.addEventListener("change", function (e) { state.mobile = e.matches; route(); })
    : MOBILE.addListener(function (e) { state.mobile = e.matches; route(); });
  window.addEventListener("hashchange", route);
  window.addEventListener("resize", function () {
    var mob = MOBILE.matches;
    if (mob !== state.mobile) { state.mobile = mob; route(); }
  });
  route();
})();

})();

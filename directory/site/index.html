<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qwen Local-Run Directory</title>
<meta name="description" content="Choose a Qwen model, see its practical hardware floor, then inspect every source-backed local-run recipe.">
<style>
/* Qwen Local-Run Directory — design system.
   A technical index: hierarchy from type, alignment and rules. Colour is a
   signal, never a surface. See docs/redesign-2026-09-10/02-design-system.md. */

:root{
  --paper:#fbfaf8; --surface:#ffffff; --sunk:#f4f3f0; --sunk-2:#edebe7;
  --ink:#15171a; --ink-2:#4a4f57; --ink-3:#767c85; --ink-4:#9aa0a8;
  --rule:#e6e4e0; --rule-2:#cfccc6; --rule-3:#a8a49d;

  --sel:#9a741c; --sel-bg:#f7f0df; --sel-line:#d8c38e;
  --ok:#1a6f4a;  --ok-bg:#e9f4ee;  --ok-line:#a9d3bd;
  --est:#7a5a12; --est-bg:#f8f1df; --est-line:#dfc78d;
  --warn:#7a2632;--warn-bg:#f8ecec;--warn-line:#d9b3b8;
  --bad:#7a2632; --bad-bg:#f8ecec; --bad-line:#d9b3b8;
  /* Collation mark: the bookseller's-pencil annotation colour. Distinct from
     --bad (a failure) -- this flags a marginal note the reader should weigh,
     not an error. Used only by the evidence-tier rail and evidence phrases. */
  --flag:#8c2f3a; --flag-bg:#f9ecec; --flag-line:#dcb3b8;
  /* Chapter band: a printed black association band behind each series in the
     model index. Warm in both themes so dark mode stays paper-and-ink, not blue. */
  --band:#15171a; --band-fg:#fbfaf8; --band-ink:#b9b5ae;

  --font-display:"Cormorant Garamond","Iowan Old Style",Baskerville,"Times New Roman",Times,serif;
  --font-body:Lora,"Iowan Old Style",Baskerville,"Times New Roman",Times,serif;
  --font-ui:"Alegreya Sans","Avenir Next",Avenir,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,"SF Mono",Menlo,"Cascadia Mono",Consolas,monospace;
  --maxw:1440px; --rail-w:208px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121316; --surface:#191b1f; --sunk:#212429; --sunk-2:#282c32;
    --ink:#eceef1; --ink-2:#b3b9c2; --ink-3:#868d97; --ink-4:#646b75;
    --rule:#2a2e34; --rule-2:#3a3f47; --rule-3:#545a63;
    --sel:#e0b45c; --sel-bg:#2a2216; --sel-line:#5c4a25;
    --ok:#5fc79a;  --ok-bg:#132720;  --ok-line:#2c5544;
    --est:#e0b45c; --est-bg:#2a2216; --est-line:#5c4a25;
    --warn:#e2939c;--warn-bg:#2c1719;--warn-line:#5c3238;
    --bad:#e2939c; --bad-bg:#2c1719; --bad-line:#5c3238;
    --flag:#e2939c; --flag-bg:#2c1719; --flag-line:#5c3238;
    --band:#efe9df; --band-fg:#211e18; --band-ink:#665f56;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121316; --surface:#191b1f; --sunk:#212429; --sunk-2:#282c32;
  --ink:#eceef1; --ink-2:#b3b9c2; --ink-3:#868d97; --ink-4:#646b75;
  --rule:#2a2e34; --rule-2:#3a3f47; --rule-3:#545a63;
  --sel:#e0b45c; --sel-bg:#2a2216; --sel-line:#5c4a25;
  --ok:#5fc79a;  --ok-bg:#132720;  --ok-line:#2c5544;
  --est:#e0b45c; --est-bg:#2a2216; --est-line:#5c4a25;
  --warn:#e2939c;--warn-bg:#2c1719;--warn-line:#5c3238;
  --bad:#e2939c; --bad-bg:#2c1719; --bad-line:#5c3238;
  --flag:#e2939c; --flag-bg:#2c1719; --flag-line:#5c3238;
  --band:#efe9df; --band-fg:#211e18; --band-ink:#665f56;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font:400 14px/1.5 var(--font-body);
  font-variant-numeric:tabular-nums;
  overflow-x:hidden;
}
h1,h2,h3,h4,p,ul,ol,dl,dd,figure{margin:0}
ul,ol{padding:0;list-style:none}
a{color:var(--sel); text-underline-offset:2px}
a:hover{text-decoration-thickness:2px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sel); outline-offset:2px; border-radius:0}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:8px;top:-40px;z-index:60;background:var(--surface);
  border:1px solid var(--rule-2);padding:8px 12px;transition:top .1s}
.skip:focus{top:8px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* ---------- primitives ---------- */
.lbl{font:620 10.5px/1.35 var(--font-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.mono{font-family:var(--font-mono);font-size:12.5px;font-weight:450}
.na{color:var(--ink-4);font-style:italic}
.prose{max-width:68ch;color:var(--ink-2);line-height:1.55}
.num{font-variant-numeric:tabular-nums}
.g{color:var(--ink-3)}

.mark{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;
  font-size:12px;font-weight:560;padding:1px 6px;border:1px solid;border-radius:0}
.m-ok{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-line)}
.m-est{color:var(--est);background:var(--est-bg);border-color:var(--est-line)}
.m-warn{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-line)}
.m-bad{color:var(--bad);background:var(--bad-bg);border-color:var(--bad-line)}
.m-none{color:var(--ink-3);background:var(--sunk);border-color:var(--rule-2)}
.m-sel{color:var(--sel);background:var(--sel-bg);border-color:var(--sel-line)}

.tag{display:inline-block;font-size:12px;color:var(--ink-2);background:var(--sunk);
  border:1px solid var(--rule);border-radius:0;padding:0 5px;white-space:nowrap}

/* ---------- masthead ---------- */
.mast{position:sticky;top:0;z-index:30;background:var(--paper);
  border-bottom:1px solid var(--rule-2)}
.mast-bar{max-width:var(--maxw);margin:0 auto;padding:0 20px;height:44px;
  display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);flex:none}
.brand-mark{font:700 10.5px/1 var(--font-mono);letter-spacing:.08em;
  border:1px solid var(--rule-3);padding:4px 5px;color:var(--ink-2)}
.brand-name{font:620 13.5px/1 var(--font-ui);letter-spacing:-.01em}
.tabs{display:flex;gap:2px;flex:none}
.tab{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 12px;
  text-decoration:none;color:var(--ink-2);font-weight:560;font-size:13.5px;
  border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink);background:var(--sunk)}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
.tab-n{font:600 11px/1 var(--font-mono);color:var(--sel);background:var(--sel-bg);
  border:1px solid var(--sel-line);border-radius:0;padding:2px 5px}
.mast-util{margin-left:auto;display:flex;align-items:center;gap:14px;flex:none}
.ulink{font-size:12.5px;color:var(--ink-3);text-decoration:none}
.ulink:hover{color:var(--ink);text-decoration:underline}
.icon-btn{background:none;border:1px solid var(--rule-2);border-radius:0;
  width:26px;height:24px;cursor:pointer;color:var(--ink-3);line-height:1}
.icon-btn:hover{color:var(--ink);border-color:var(--rule-3)}
/* Information-mode control: two mutually-exclusive buttons, never a select
   or a tab -- see docs/builder-concerns-2026-09-16/lite-pro-content-contract.md
   section 3. State is shown by weight + fill, not colour alone. */
.mode-ctl{display:flex;border:1px solid var(--rule-2);border-radius:0;overflow:hidden;flex:none}
/* display:flex above beats the UA's [hidden]{display:none}, so the attribute
   needs restating or hiding the control on mode-blind routes does nothing. */
.mode-ctl[hidden]{display:none}
.mode-btn{background:var(--surface);border:0;border-right:1px solid var(--rule-2);
  padding:0 10px;height:24px;font:560 11.5px/1 var(--font-ui);letter-spacing:.02em;
  color:var(--ink-3);cursor:pointer}
.mode-btn:last-child{border-right:0}
.mode-btn:hover{color:var(--ink);background:var(--sunk)}
.mode-btn[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:700}
.mast-sub{max-width:var(--maxw);margin:0 auto;padding:0 20px 7px;
  font-size:12.5px;color:var(--ink-3);max-width:min(var(--maxw),100%)}
.mast-sub b{color:var(--ink-2);font-weight:560}

/* ---------- shell ---------- */
.shell{max-width:var(--maxw);margin:0 auto;padding:0 20px;
  display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);gap:0 24px;align-items:start}
.main{min-width:0;padding-bottom:120px}
.main:focus{outline:none}

/* ---------- family rail ---------- */
.rail[hidden]{display:none}
.rail{position:sticky;top:78px;max-height:calc(100vh - 96px);overflow:auto;
  padding:14px 0 40px;border-right:1px solid var(--rule);margin-right:-1px}
.rail-grp+.rail-grp{margin-top:16px}
.rail-grp>.lbl{display:block;padding:0 8px 5px}
.rail a,.rail button{display:flex;width:100%;gap:8px;align-items:baseline;
  text-align:left;background:none;border:0;cursor:pointer;
  padding:4px 8px;font-size:13px;color:var(--ink-2);text-decoration:none;border-left:2px solid transparent}
.rail a:hover,.rail button:hover{background:var(--sunk);color:var(--ink)}
.rail .rc{margin-left:auto;font:450 11.5px/1 var(--font-mono);color:var(--ink-4)}
.rail [aria-pressed="true"]{color:var(--sel);border-left-color:var(--sel);background:var(--sel-bg);font-weight:560}
.rail [data-spy="1"]{color:var(--ink);border-left-color:var(--rule-3);font-weight:560}

/* ---------- filter bar ---------- */
.bar{position:sticky;top:44px;z-index:20;background:var(--paper);
  padding:10px 0 8px;border-bottom:1px solid var(--rule-2)}
.bar-search{display:flex;gap:8px;align-items:center}
#q{flex:1;min-width:0;height:34px;padding:0 10px;font:400 13.5px var(--font-ui);
  color:var(--ink);background:var(--surface);border:1px solid var(--rule-2);border-radius:0}
#q::placeholder{color:var(--ink-4)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.fsel{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 6px 0 8px;
  background:var(--surface);border:1px solid var(--rule-2);border-radius:0;font-size:12.5px}
.fsel>span{color:var(--ink-3);font-size:11.5px}
.fsel select{border:0;background:none;font:inherit;color:var(--ink);
  max-width:140px;padding:0;cursor:pointer}
.fsel:focus-within{border-color:var(--sel)}
.fsel.on{border-color:var(--sel);background:var(--sel-bg)}
.btn{height:28px;padding:0 10px;background:var(--surface);border:1px solid var(--rule-2);
  border-radius:0;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.btn:hover{border-color:var(--rule-3);color:var(--ink)}
.btn.on{border-color:var(--sel);color:var(--sel);background:var(--sel-bg)}
.btn-p{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:560}
.btn-p:hover{opacity:.88;color:var(--paper)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.bar-end{margin-left:auto;display:flex;gap:8px;align-items:center}
.count{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.count b{color:var(--ink);font-weight:620}

.adv{margin-top:8px;padding:12px;background:var(--sunk);border:1px solid var(--rule)}
.adv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:10px 16px}
.adv-note{margin-top:10px;font-size:12px;color:var(--ink-3);max-width:68ch}
.fld{display:block}
.fld>.lbl{display:block;margin-bottom:3px}
.fld select,.fld input[type=text],.fld input[type=number]{width:100%;height:28px;
  background:var(--surface);border:1px solid var(--rule-2);border-radius:0;
  font:400 12.5px var(--font-ui);color:var(--ink);padding:0 6px}
.range{display:flex;gap:6px;align-items:center}
.range input{width:100%}

.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 4px 0 8px;
  font-size:12px;background:var(--sel-bg);color:var(--sel);
  border:1px solid var(--sel-line);border-radius:0;cursor:pointer}
.chip b{font-weight:620}
.chip:hover{background:var(--surface)}
.chip .x{font-size:13px;line-height:1}

.disclose{margin:12px 0 0;padding:10px 12px;background:var(--warn-bg);
  border:1px solid var(--warn-line);
  color:var(--warn);font-size:12.5px;max-width:78ch}
.disclose b{font-weight:620}

/* ---------- shelf ---------- */
.shelf{margin-top:26px;scroll-margin-top:118px}
.shelf-head{border-top:2px solid var(--rule-3);padding-top:10px}
.shelf-top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.shelf-top h2{font:600 28px/1.1 var(--font-display);letter-spacing:-.01em}
.models-intro h1,.page h1,.model-preview-head h2,.model-page-baseline>h2{font-family:var(--font-display);font-weight:600;letter-spacing:-.01em}
.shelf-top h2 a{color:inherit;text-decoration:none}
.shelf-top h2 a:hover{text-decoration:underline}
.shelf-meta{margin-left:auto;font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.shelf-meta b{color:var(--ink-2);font-weight:560}
.spec{display:flex;flex-wrap:wrap;gap:4px 26px;margin-top:9px}
.spec>div{min-width:0}
.spec .lbl{display:block}
.spec .v{font-size:13px;color:var(--ink);white-space:nowrap}
.spec .v.mono{font-size:12.5px}
.regr{margin-top:8px}
.regr>summary{cursor:pointer;font-size:12.5px;color:var(--warn);width:max-content}
.regr ul{margin-top:6px;padding-left:16px;list-style:disc;color:var(--ink-2);
  font-size:12.5px;max-width:68ch}
.regr li{margin:3px 0}

/* ---------- model-first home ---------- */
/* ---------- models-home hero: printed-contents reference (2026-09-12) ----- */
.mf-hero{
  position:relative;
  --hero-ground:#efece4;
  background:var(--hero-ground);
  margin:0 -20px;
  padding:20px 34px 18px;
  border-bottom:1px solid var(--rule-2);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .mf-hero{--hero-ground:#1b1d21} }
:root[data-theme="dark"] .mf-hero{--hero-ground:#1b1d21}

.mf-eyebrow{
  display:flex;align-items:baseline;gap:56px;
  font:450 10.5px/1 var(--font-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);
}
.mf-eyebrow-end{margin-left:auto;letter-spacing:.12em}

.mf-body{
  display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.5fr);
  gap:0 48px;margin-top:104px;
}
.mf-title{display:flex;gap:18px;align-items:baseline}
.mf-title h1{
  font:700 25px/1.12 var(--font-ui);letter-spacing:.01em;text-transform:uppercase;
  max-width:14ch;
}
.mf-n{
  font:450 11px/1.6 var(--font-mono);letter-spacing:.14em;color:var(--ink-3);
  flex:none;font-variant-numeric:tabular-nums;
}
.mf-lede p{
  max-width:62ch;color:var(--ink-2);font-size:13px;line-height:1.55;margin-bottom:18px;
}
.mf-index{border-top:1px solid var(--rule-2)}
.mf-index li{border-bottom:1px solid var(--rule-2)}
.mf-item{
  display:flex;align-items:baseline;gap:12px;width:100%;
  background:none;border:0;cursor:pointer;text-align:left;
  padding:9px 2px;color:var(--ink);
  font:450 11.5px/1.4 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;
}
.mf-item:hover{background:rgb(0 0 0 / .035)}
:root[data-theme="dark"] .mf-item:hover{background:rgb(255 255 255 / .05)}
.mf-sep{color:var(--ink-4)}
.mf-name{font-weight:600;letter-spacing:.09em}
.mf-dots{flex:1;min-width:14px}
.mf-meta{color:var(--ink-3);letter-spacing:.08em;white-space:nowrap}
.mf-fig{
  width:3ch;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2);
  flex:none;
}
.mf-item.is-on{color:var(--sel)}
.mf-item.is-on .mf-name,.mf-item.is-on .mf-fig,.mf-item.is-on .mf-meta{color:var(--sel)}
.mf-item.is-on .mf-n{color:var(--sel)}

.mf-foot{
  display:flex;justify-content:space-between;margin-top:26px;
  font:450 10px/1 var(--font-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-4);
}

@media (max-width:1179px){
  .mf-body{grid-template-columns:minmax(0,1fr);gap:22px;margin-top:64px}
  .mf-title h1{max-width:none}
}
@media (max-width:719px){
  .mf-hero{margin:0 -14px;padding:16px 14px 14px}
  .mf-eyebrow{gap:20px;font-size:9.5px;letter-spacing:.14em}
  .mf-eyebrow-end{flex-basis:100%;margin-left:0;margin-top:6px}
  .mf-body{margin-top:40px;gap:18px}
  .mf-title h1{font-size:21px}
  .mf-item{font-size:10.5px;letter-spacing:.07em;gap:8px;padding:11px 2px;min-height:44px;align-items:center}
  .mf-meta{display:none}
  .mf-foot{margin-top:18px;font-size:9px;letter-spacing:.1em}
}

/* ---------- the contents page ---------- */
.toc{margin-top:4px}
.toc-sec{
  display:block;padding:0 0 4px;border-top:1px solid var(--rule-2);
}
.toc-sec:first-child{border-top:0}
/* Each series is a dark association band that sticks to the top of the index. */
.toc-chapter{
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  position:sticky;top:86px;z-index:2;
  background:var(--band);color:var(--band-fg);
  padding:7px 12px;
}
.toc-chapter h2{
  font:700 13px/1.3 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--band-fg);
}
.toc-cmeta{
  font:450 10px/1.4 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--band-ink);white-space:nowrap;
}
.toc-items{border-top:1px solid var(--rule-2)}
.toc-items>li{border-bottom:1px solid var(--rule)}
.toc-item{
  display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:0 10px;
  align-items:baseline;padding:6px 12px;text-decoration:none;color:var(--ink);
}
.toc-item:hover{background:rgb(0 0 0 / .035)}
:root[data-theme="dark"] .toc-item:hover{background:rgb(255 255 255 / .05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .toc-item:hover{background:rgb(255 255 255 / .05)}}
.toc-n{
  font:450 11px/1.7 var(--font-mono);letter-spacing:.08em;color:var(--ink-4);
  font-variant-numeric:tabular-nums;
}
.toc-sep{font:450 11px/1.7 var(--font-mono);color:var(--ink-4)}
.toc-main{min-width:0}
.toc-name{
  display:block;font:600 12.5px/1.45 var(--font-mono);letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.toc-item:hover .toc-name{text-decoration:underline;text-underline-offset:3px}
/* Line two: concise inline metadata keeps its full recorded extent; the summary
   takes the remaining space and clamps to one line, never a multi-line block. */
.toc-sub{display:flex;align-items:baseline;gap:8px;min-width:0;margin-top:1px;flex-wrap:wrap}
.toc-meta{
  flex:0 1 auto;min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font:450 10px/1.5 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);
}
.toc-intro{
  flex:1 1 12ch;min-width:0;font:400 12px/1.5 var(--font-body);color:var(--ink-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.toc-fig{
  text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;align-self:center;
}
.toc-fig b{display:block;font:600 13px/1.15 var(--font-mono);color:var(--ink-2)}
.toc-fig small{
  display:block;margin-top:1px;
  font:450 8.5px/1.2 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-4);
}
.toc-foot{
  display:flex;justify-content:space-between;gap:16px;margin-top:26px;padding-top:12px;
  border-top:1px solid var(--rule-2);
  font:450 10px/1.4 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-4);
}

.models-home{padding:22px 0 20px}
.models-intro{display:flex;align-items:end;gap:20px;border-bottom:2px solid var(--rule-3);padding-bottom:13px}

.models-intro p{max-width:72ch;color:var(--ink-2);line-height:1.5}
.model-controls{display:grid;grid-template-columns:minmax(260px,1fr) auto auto auto auto;gap:8px;
  align-items:end;padding:11px 0;border-bottom:1px solid var(--rule-2)}
.model-controls label{display:block}
.model-controls .lbl{display:block;margin-bottom:3px}
.model-controls input,.model-controls select{height:32px;background:var(--surface);color:var(--ink);
  border:1px solid var(--rule-2);border-radius:0;padding:0 8px;font:400 12.5px var(--font-ui)}
.model-controls input{width:100%;font-size:13.5px}

.model-controls select{min-width:118px}

.model-count{align-self:center;margin-top:15px;color:var(--ink-3);font-size:12.5px;white-space:nowrap}

.model-master{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,430px);gap:28px;align-items:start}
.model-index{min-width:0}
.model-list-head,.model-row{display:grid;grid-template-columns:minmax(210px,1.25fr) 104px minmax(210px,1fr) 142px 34px;
  gap:10px;align-items:center}
.model-list-head{padding:10px 10px 6px;color:var(--ink-3);font:620 10.5px/1.35 var(--font-ui);
  letter-spacing:.07em;text-transform:uppercase;border-bottom:1px solid var(--rule-2)}
.model-list>li{border-bottom:1px solid var(--rule)}
.model-row{position:relative;width:100%;min-height:70px;padding:9px 10px;background:none;border:0;text-align:left;cursor:pointer}
.model-row:hover{background:var(--sunk)}
.model-row:active{transform:translateY(1px)}
.model-row.is-selected{background:var(--sel-bg)}
.model-row.is-selected::before{content:"";position:absolute;left:0;top:0;bottom:0;width:1px;background:var(--sel)}
.model-row>span{min-width:0}
.model-id,.model-context,.model-floor,.model-speed{display:flex;flex-direction:column;gap:2px}
.model-id strong{font-size:14px;font-weight:620;line-height:1.3;color:var(--ink)}
.model-id>span,.model-row small{font-size:11.5px;line-height:1.35;color:var(--ink-3)}
.model-context>span:not(.lbl),.model-floor>span:not(.lbl){font-size:12.5px;color:var(--ink);line-height:1.35}
.model-floor small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.model-speed strong{font:600 18px/1.15 var(--font-ui);color:var(--ink)}
.model-speed strong small{font:400 11.5px/1 var(--font-ui);color:var(--ink-3)}
.model-open{justify-self:end;color:var(--sel);font-size:11.5px;font-weight:560}
.model-preview{position:sticky;top:86px;margin-top:12px;padding:15px 0 17px;background:var(--surface);
  border:0;border-top:2px solid var(--rule-3);max-height:calc(100vh - 104px);overflow:auto}
.model-preview-head h2{font:640 23px/1.18 var(--font-ui);letter-spacing:-.015em;margin-top:3px}
.model-preview-head p{margin-top:7px;color:var(--ink-2);font-size:13px;line-height:1.5}
.model-tags{display:flex;flex-wrap:wrap;gap:5px 12px;margin-top:9px;color:var(--ink-3);font-size:11.5px}
.baseline,.baseline-missing{margin-top:16px;border-top:1px solid var(--rule-2);padding-top:13px}
.baseline-title{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.baseline-title h3{font:620 17px/1.3 var(--font-ui);margin-top:2px;max-width:25ch}
.baseline-why,.baseline-missing p{margin-top:7px;color:var(--ink-2);font-size:12.5px;line-height:1.5}
.baseline-missing h3{font:620 15px/1.3 var(--font-ui);color:var(--warn)}

.baseline-spec dt{font:620 10.5px/1.35 var(--font-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}

.baseline-trade{margin-top:14px}

.baseline-trade li+li{margin-top:4px}
.model-preview-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px;padding-top:12px;border-top:1px solid var(--rule-2)}
.model-preview-actions .btn{display:inline-flex;align-items:center;text-decoration:none;white-space:nowrap}
.model-page-baseline>.model-preview-head{display:none}
.model-page-baseline>h2{font:620 16px/1.3 var(--font-ui);margin-bottom:9px}
.model-page-baseline .model-preview-actions a:first-child{display:none}

/* ---------- two-panel model navigator (#/) ---------- */
/* The homepage masthead collapses into one compact printed band. */
.mh-mast{padding:10px 34px}
.mh-mast-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.mh-mast-row .mf-n{font:450 11px/1.5 var(--font-mono);letter-spacing:.14em;color:var(--ink-3);font-variant-numeric:tabular-nums}
.mh-mast-row h1{font:700 16px/1.3 var(--font-ui);letter-spacing:.04em;text-transform:uppercase;color:var(--ink)}
.mh-mast-sep{color:var(--ink-4)}
.mh-mast-guide{font:400 13px/1.4 var(--font-body);color:var(--ink-2)}
.mh-mast-stat{margin-left:auto;font:450 10.5px/1.4 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
/* True 50/50: the sticky evidence panel and the series index share the frame. */
.model-master.mh-split{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;margin-top:14px;align-items:start}
.mh-panel{min-width:0}
.mh-panel .model-preview{max-height:calc(100vh - 240px);min-height:420px}
.mh-index{min-width:0;position:sticky;top:86px;max-height:calc(100vh - 240px);min-height:420px;display:flex;flex-direction:column}
.mh-index-head{flex:none;display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  border-bottom:2px solid var(--rule-3);padding-bottom:7px}
.mh-index-meta{color:var(--ink-3);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.mh-index .toc{margin-top:0;min-height:0;flex:1 1 auto;overflow:auto;scrollbar-gutter:stable}
.mh-index .toc-sec:first-child{border-top:0}
.mh-index .toc-chapter{top:0}
.mh-index .toc-foot{flex:none}
.toc-item{position:relative}
.toc-item.is-sel{background:var(--sel-bg)}
.toc-item.is-sel .toc-name,.toc-item.is-sel .toc-n,.toc-item.is-sel .toc-fig b{color:var(--sel)}
.toc-item.is-sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--sel)}
@media (max-width:1179px){
  .model-master.mh-split{grid-template-columns:minmax(0,1fr);gap:24px}
  .mh-panel .model-preview{position:static;max-height:none;min-height:0;margin-top:0}
  .mh-index{position:static;max-height:none;min-height:0;display:block}
  .mh-index .toc{overflow:visible}
  .mh-mast{padding:10px 20px}
}

  .mh-mast-row h1{font-size:15px}
  .mh-mast-guide,.mh-mast-stat{flex-basis:100%;margin-left:0}
}

/* ---------- rows (desktop table) ---------- */
.rows{width:100%;border-collapse:collapse;margin-top:10px;table-layout:fixed}
.rows caption{text-align:left;position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.rows thead th{
  font:620 10.5px/1.35 var(--font-ui);letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-3);text-align:left;padding:0 8px 5px;border-bottom:1px solid var(--rule-2);
  font-weight:620}
.rows th.r,.rows td.r{text-align:right}
.c-sel{width:30px} .c-quant{width:98px} .c-eng{width:124px} .c-hw{width:140px}
.c-ready{width:96px} .c-dec{width:158px} .c-ev{width:74px} .c-upd{width:70px} .c-exp{width:30px}
.rows th.c-ev{white-space:nowrap}
.ev-hd{display:block;font:620 8.5px/1 var(--font-ui);letter-spacing:.14em;color:var(--ink-4);margin-top:3px}
.rows tbody tr{border-bottom:1px solid var(--rule)}
.rows tbody tr:hover{background:var(--sunk)}
.rows tbody tr[data-row]{cursor:pointer}
.rows tbody tr[data-row] input,.rows tbody tr[data-row] button{cursor:auto}
.rows tbody tr[data-row] button:hover{cursor:pointer}
.rows td{padding:8px;vertical-align:top;overflow-wrap:anywhere}
.rows tbody tr:not(.det){height:1px}
.rows tr.sel-on{background:var(--sel-bg)}
.rows tr.sel-on:hover{background:var(--sel-bg)}
.rows td.c-sel{position:relative}
tr.sel-on td.c-sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--sel)}
tr.fail td.c-sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--bad)}
.l1{font-size:14px;font-weight:560;line-height:1.35}
.l1.mono{font-weight:450;font-size:13px}
.l2{font-size:12.5px;color:var(--ink-3);line-height:1.35;margin-top:2px}
td .l2.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.l2 .warn{color:var(--warn)} .l2 .bad{color:var(--bad)}
.l2 .variant{color:var(--ink-2)}
.l2 .variant>i{font:620 9px/1 var(--font-ui);letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-4);font-style:normal;margin-right:5px}
.dec-v{font:600 19px/1.15 var(--font-ui);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.dec-u{font-size:11.5px;color:var(--ink-3);font-weight:400;margin-left:2px}
td.c-dec .l2{margin-top:1px}
.cbx{width:15px;height:15px;margin:2px 0 0;accent-color:var(--sel);cursor:pointer}
.exp-btn{width:24px;height:24px;background:none;border:1px solid transparent;border-radius:0;
  cursor:pointer;color:var(--ink-3);line-height:1;font-size:11px}
.exp-btn:hover{border-color:var(--rule-2);color:var(--ink)}
tr.open{background:var(--sunk)}

/* evidence strip */
.ev{display:inline-flex;gap:3px;cursor:help;background:none;border:0;padding:2px 0}
.ev i{font-style:normal;font-size:12px;line-height:1;width:13px;text-align:center}
.ev .v-ok{color:var(--ok)} .ev .v-est{color:var(--est)}
.ev .v-none{color:var(--ink-4)} .ev .v-bad{color:var(--bad)}

/* detail panel */
tr.det>td{padding:0;border-bottom:1px solid var(--rule-2)}
.det-in{background:var(--surface);border-left:1px solid var(--rule-2);padding:16px 18px 18px}
.det-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px 26px}
.sec+.sec{margin-top:16px}
.sec>h2,.sec>h3{font:620 15px/1.3 var(--font-ui);margin-bottom:7px}
.sec>h2 .g,.sec>h3 .g{font-weight:400;font-size:12.5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:13px}
.kv dt{font:620 10.5px/1.5 var(--font-ui);letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-3);white-space:nowrap}
.kv dd{margin:0;color:var(--ink);min-width:0;overflow-wrap:anywhere}
.cmd{display:flex;gap:8px;align-items:flex-start;background:var(--sunk);
  border:1px solid var(--rule);padding:7px 8px;margin:5px 0}
.cmd code{flex:1;min-width:0;font-family:var(--font-mono);font-size:12.5px;
  white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink)}
.copy{flex:none;height:22px;padding:0 8px;font-size:11.5px;background:var(--surface);
  border:1px solid var(--rule-2);border-radius:0;cursor:pointer;color:var(--ink-2)}
.copy:hover{border-color:var(--rule-3);color:var(--ink)}
.steps{counter-reset:s;margin:4px 0}
.steps>li{counter-increment:s;display:grid;grid-template-columns:22px 1fr;gap:8px;
  padding:3px 0;font-size:13px;align-items:start}
.steps>li::before{content:counter(s) ".";color:var(--ink-4);font:450 11.5px/1.7 var(--font-mono)}
.steps .do{color:var(--ink-2);line-height:1.5}
.notes{margin:0;padding-left:16px;list-style:disc;color:var(--ink-2);font-size:13px;max-width:68ch}
.notes li{margin:4px 0;line-height:1.5}
.notes.bad li::marker{color:var(--bad)}
.notes.warn li::marker{color:var(--warn)}
.mtab{width:100%;border-collapse:collapse;font-size:12.5px}
.mtab th{text-align:left;font:620 10.5px/1.4 var(--font-ui);letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink-3);padding:0 8px 4px 0;border-bottom:1px solid var(--rule)}
.mtab td{padding:5px 8px 5px 0;border-bottom:1px solid var(--rule);vertical-align:top;color:var(--ink-2)}
.mtab td.v{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:560;white-space:nowrap}
.mtab .tier{font:620 9.5px/1.4 var(--font-ui);letter-spacing:.08em;text-transform:uppercase}
.t-box{color:var(--ok)} .t-forum{color:var(--est)} .t-vendor{color:var(--ink-3)}
.tier-band{font:620 10.5px/1.4 var(--font-ui);letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-3);padding-top:9px}
.scrollx{overflow-x:auto}
.det-foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:12px;
  border-top:1px solid var(--rule)}
.srcs{display:grid;gap:5px;font-size:12.5px}
.srcs a{overflow-wrap:anywhere}
.srck{font:620 9.5px/1.4 var(--font-ui);letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);margin-right:6px}

/* mobile rows */
.rows-m{margin-top:10px}
.rows-m>li{border-bottom:1px solid var(--rule);padding:10px 0 10px 11px;position:relative}
.rows-m>li[data-row]>.mrow-top{cursor:pointer}
.rows-m>li[data-row]>.mrow-top input,.rows-m>li[data-row]>.mrow-top button{cursor:auto}
.rows-m>li[data-row]>.mrow-top button:hover{cursor:pointer}
.rows-m>li.sel-on{background:var(--sel-bg)}
.rows-m>li.sel-on::before,.rows-m>li.fail::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px}
.rows-m>li.sel-on::before{background:var(--sel)}
.rows-m>li.fail::before{background:var(--bad)}
.mrow-top{display:flex;gap:9px;align-items:flex-start}
.mrow-body{flex:1;min-width:0}
.mrow-l{display:flex;flex-wrap:wrap;gap:3px 12px;margin-top:5px;font-size:12.5px;color:var(--ink-3)}
.mrow-l .lbl{margin-right:4px}
.mrow-dec{display:flex;align-items:baseline;gap:7px;margin-top:6px;flex-wrap:wrap}
.mrow-act{display:flex;gap:8px;align-items:center;margin-top:7px;flex-wrap:wrap}
.rows-m .det-in{margin-top:10px;padding:12px 12px 14px}

/* ---------- compare rail ---------- */
.crail{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);
  border-top:1px solid var(--rule-2);box-shadow:0 -1px 0 var(--rule);
  padding:10px 20px 11px;transform:translateY(8px);animation:rise .14s ease-out forwards}
@keyframes rise{to{transform:translateY(0)}}
.crail-in{max-width:var(--maxw);margin:0 auto;display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.crail-hd{font:620 10.5px/1.4 var(--font-ui);letter-spacing:.07em;text-transform:uppercase;
  color:var(--sel);flex:none;padding-top:4px}
.crail-items{display:flex;gap:8px;flex-wrap:wrap;flex:1;min-width:0}

  border:1px solid var(--rule-2);padding:5px 7px}
.citem .cbody{min-width:0;flex:1}

.cx{flex:none;width:20px;height:20px;background:none;border:0;cursor:pointer;
  color:var(--ink-3);font-size:13px;line-height:1;border-radius:0}
.cx:hover{background:var(--sunk);color:var(--bad)}
.crail-end{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-left:auto;min-width:0}
.crail-end .btn,.crail-end .btn-p{white-space:nowrap}
.crail-cmp{flex-basis:100%;font-size:12px;margin-top:2px;white-space:normal;align-items:flex-start}

/* ---------- compare workspace ---------- */
.cmp-wrap{overflow-x:auto;margin-top:14px;border:1px solid var(--rule)}
.cmp{border-collapse:collapse;width:100%;min-width:640px;font-size:13px}
.cmp th,.cmp td{border-bottom:1px solid var(--rule);border-right:1px solid var(--rule);

  color:var(--ink-3);font-weight:620;white-space:normal}
.cmp thead th{background:var(--sunk);font-size:13px;font-weight:620;color:var(--ink);vertical-align:bottom}
.cmp thead th.k{background:var(--sunk)}
.cmp tr.grp th{background:var(--sunk-2);font:620 11px/1.4 var(--font-ui);letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-2);border-top:2px solid var(--rule-2)}
.cmp tr.grp th.k{background:var(--sunk-2)}
.cmp td .cond,.cmp th .cond{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px;font-weight:400}

.cmp-key{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--ink-3)}
.banner{margin-top:14px;border:1px solid;padding:11px 13px;max-width:88ch}
.banner h3{font:620 13px/1.3 var(--font-ui);margin-bottom:5px}
.banner ul{margin-top:5px;padding-left:16px;list-style:disc;font-size:12.5px}
.banner li{margin:3px 0;line-height:1.5}
.b-warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.b-ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.b-info{background:var(--sunk);border-color:var(--rule-2);color:var(--ink-2)}

/* ---------- generic page ---------- */
.page{padding:20px 0 40px;max-width:1000px}
.page.wide{max-width:none}
.page h1{font:620 24px/1.2 var(--font-ui);letter-spacing:-.015em}
.recipe-page>h1{font:600 clamp(34px,5vw,58px)/1.03 var(--font-display);letter-spacing:-.025em;max-width:17ch;margin-top:3px}
.page>p.lede{margin-top:7px;font-size:14px;color:var(--ink-2);max-width:68ch}
.crumb{font-size:12.5px;color:var(--ink-3);margin-bottom:9px}
.crumb a{color:var(--ink-3)}
.psec{margin-top:24px;border-top:1px solid var(--rule-2);padding-top:13px}
.psec>h2{font:620 16px/1.3 var(--font-ui);margin-bottom:9px}
.psec>h2 .g{font-weight:400;font-size:12.5px}
.psec h3{font:620 13px/1.3 var(--font-ui);margin:13px 0 5px}
.psec p{margin:7px 0;max-width:68ch;color:var(--ink-2);line-height:1.55}
.psec p.tight{margin:3px 0}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px 28px}

/* Recipe detail: the main column reads like a dossier; the rail keeps the
   measurement conditions and provenance visible while the title is in view. */
.recipe-layout{display:grid;grid-template-columns:minmax(0,1fr) 236px;gap:32px;align-items:start;margin-top:18px}
.recipe-main{min-width:0}
.recipe-rail{position:sticky;top:78px;border-top:2px solid var(--rule-3);padding-top:11px}
.recipe-rail section+section{border-top:1px solid var(--rule-2);margin-top:20px;padding-top:13px}
.recipe-rail h2{font:620 10.5px/1.35 var(--font-ui);letter-spacing:.1em;color:var(--ink-2);margin-bottom:9px}
.recipe-rail dl{display:grid;gap:8px}
.recipe-rail dt{font:620 10px/1.3 var(--font-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.recipe-rail dd{margin:0;color:var(--ink);font-size:12.5px;line-height:1.45;overflow-wrap:anywhere}
.recipe-rail p{margin-top:10px;color:var(--ink-3);font-size:11.5px;line-height:1.5}
.recipe-rail ul{display:grid;gap:5px;color:var(--ink-2);font-size:12px}
.recipe-rail li::first-letter{color:var(--sel)}
.recipe-actions{margin-top:0;padding:0 0 12px;border-bottom:1px solid var(--rule-2)}
.recipe-actions .copy{height:28px;padding:0 10px;background:var(--ink);color:var(--paper);border-color:var(--ink);font:560 12.5px var(--font-ui)}
.recipe-meta{display:flex;flex-wrap:wrap;gap:4px 16px;padding:9px 0;color:var(--ink-3);font-size:11.5px}
.recipe-meta b{font:620 9.5px var(--font-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);margin-right:3px}
.recipe-status{margin-top:0}

/* ---------- Lite/Pro recipe composer ---------------------------------- */
/* Lite renders as a reading copy: section titles move to the book serif,
   larger and warmer, the same voice as .prose. Pro stays in the humanist
   sans -- it reads as instrumentation, not narrative. This is the one
   typographic signal that tells a reader which mode they are in without
   relying on the mode control alone. */
.lite-copy .sec>h2,.lite-copy .sec>h3{font:600 18px/1.3 var(--font-body);letter-spacing:0}
.pro-copy .sec>h2,.pro-copy .sec>h3{font:620 14px/1.3 var(--font-ui);letter-spacing:.01em}
.pro-copy .sec{padding-top:2px}
.dossier{margin-top:22px;padding-top:14px;border-top:1px solid var(--rule-2)}
.dossier-hd{display:flex;align-items:baseline;gap:8px;margin-bottom:13px}
.dossier-hd h2{font:620 13px/1.3 var(--font-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.dossier-hd .g{font-size:11.5px}
.dossier .sec>h2,.dossier .sec>h3{font:620 13.5px/1.3 var(--font-ui);letter-spacing:.01em}

/* Evidence phrase -- the six literal phrases the content contract requires
   in place of a confidence badge. Serif italic, quote-adjacent but not a
   blockquote: it reports what was said about the evidence, in the source's
   own register. */
.coll-phrase{display:inline-block;font:italic 500 13px/1.4 var(--font-body);color:var(--ink-2);
  padding:2px 0}

/* Collation strip -- a vertical rail of tick marks down the left edge of a
   recipe row/detail: shape + fill encode provenance tier and completeness,
   colour is a reinforcement, never the only signal (AGENTS.md accessibility
   law). A solid square is box-measured; a half-filled square is forum with
   full conditions; a hollow square is vendor or forum with a gap. */
.coll-rail{display:inline-flex;align-items:center;gap:3px;flex:none}
.coll-tick{width:9px;height:9px;border:1.4px solid var(--ink-3);flex:none}
.coll-tick[data-fill="full"]{background:var(--ink-3)}
.coll-tick[data-fill="half"]{background:linear-gradient(90deg,var(--ink-3) 50%,transparent 50%)}
.coll-tick[data-fill="none"]{background:transparent}
.coll-tick[data-tier="box"]{border-color:var(--ok);}
.coll-tick[data-fill="full"][data-tier="box"]{background:var(--ok)}
.coll-tick[data-fill="half"][data-tier="box"]{background:linear-gradient(90deg,var(--ok) 50%,transparent 50%)}
.coll-tick[data-tier="forum"]{border-color:var(--est)}
.coll-tick[data-fill="full"][data-tier="forum"]{background:var(--est)}
.coll-tick[data-fill="half"][data-tier="forum"]{background:linear-gradient(90deg,var(--est) 50%,transparent 50%)}
.coll-tick[data-tier="vendor"]{border-color:var(--ink-4)}
.coll-tick[data-fill="full"][data-tier="vendor"]{background:var(--ink-4)}
.coll-tick[data-fill="half"][data-tier="vendor"]{background:linear-gradient(90deg,var(--ink-4) 50%,transparent 50%)}
.coll-note{margin-left:5px;font-size:11px;color:var(--ink-3)}

/* Technique card -- "how it seeks performance", the Uses/Designed to/
   Evidence here structure from the content contract section 4.5. */
.tech-card{border:0;border-top:1px solid var(--rule-2);padding:10px 0;margin-bottom:0;background:transparent}
.tech-card+.tech-card{margin-top:0}
.tech-card dt{font:620 10px/1.4 var(--font-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-top:6px}
.tech-card dt:first-child{margin-top:0}
.tech-card dd{margin:1px 0 0;color:var(--ink-2);line-height:1.5;max-width:64ch}

/* A marginal flag: caveat-adjacent but not severity -- see --flag token. */
.flagnote{border-left:2px solid var(--flag-line);background:var(--flag-bg);color:var(--flag);
  padding:6px 9px;font-size:12.5px;line-height:1.5;margin:8px 0;max-width:64ch}

.rawjson{margin-top:10px}
.rawjson>summary{cursor:pointer;font-size:12.5px;color:var(--ink-2)}
.rawjson pre{margin-top:8px;background:var(--sunk);border:1px solid var(--rule);
  padding:11px;overflow:auto;max-height:460px;font:450 11.5px/1.55 var(--font-mono)}
.empty{padding:34px 0;max-width:68ch}
.empty h2{font:620 16px/1.3 var(--font-ui);margin-bottom:7px}
.empty p{color:var(--ink-2);margin:6px 0}
.empty .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* ---------- my hardware ---------- */
.hw{display:grid;grid-template-columns:380px minmax(0,1fr);gap:26px;padding:20px 0 40px;align-items:start}
.hw-pane{position:sticky;top:78px;border:0;border-top:2px solid var(--rule-3);background:transparent;padding:14px 0}
.hw-modes{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:10px 0 13px}
.hw-form{display:grid;gap:8px}
.hw-form.two-up{grid-template-columns:1fr 1fr;gap:8px 10px}
.hw-form.two-up .fld:first-child,.hw-form.two-up .fld:nth-child(2),.hw-form.two-up .fld:nth-child(3){grid-column:1 / -1}
.hw-form .fld input,.hw-form .fld select{width:100%}
.det-line{font-size:12px;color:var(--ink-3);margin-top:3px}
.det-res{margin-top:10px;font-size:12.5px;display:grid;gap:4px}
.det-res .row{display:grid;grid-template-columns:88px 1fr;gap:8px}
.privacy{margin-top:12px;padding:9px 10px;background:var(--sunk);border:1px solid var(--rule);
  font-size:11.5px;color:var(--ink-2);line-height:1.5}
.assump{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-top:10px;
  padding:11px 12px;background:var(--sunk);border:1px solid var(--rule)}
.grp-hd{display:flex;align-items:baseline;gap:10px;border-top:1px solid var(--rule-2);
  padding-top:11px;margin-top:20px;cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.grp-hd h2{font:620 13.5px/1.3 var(--font-ui);letter-spacing:.02em}
.grp-hd .n{margin-left:auto;font:600 13px/1 var(--font-mono);color:var(--ink-3)}
.res{border:0;border-top:1px solid var(--rule);background:transparent;
  padding:11px 0;margin-top:9px}
.res.v-ok{border-left-color:var(--ok)} .res.v-est{border-left-color:var(--est)}
.res.v-none{border-left-color:var(--rule-3)} .res.v-bad{border-left-color:var(--bad)}
.res-top{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.res-top h3{font:620 14px/1.35 var(--font-ui);flex:1;min-width:220px}
.res-top h3 a{color:inherit;text-decoration:none}
.res-top h3 a:hover{text-decoration:underline}
.verdict{margin-top:6px;font-size:13.5px;color:var(--ink);max-width:74ch;line-height:1.5}
.calc{margin-top:9px}
.calc>summary{cursor:pointer;font-size:12.5px;color:var(--ink-2);width:max-content}
.calc-tab{width:100%;border-collapse:collapse;margin-top:8px;font-size:12.5px;max-width:74ch}
.calc-tab th{text-align:left;font:620 10.5px/1.4 var(--font-ui);letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink-3);padding:4px 10px 4px 0;white-space:nowrap;
  vertical-align:top;width:170px}
.calc-tab td{padding:4px 0;color:var(--ink-2);vertical-align:top}
.calc-tab td b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.calc-tab tr.tot th,.calc-tab tr.tot td{border-top:1px solid var(--rule-2);padding-top:6px}
.res-act{display:flex;gap:8px;align-items:center;margin-top:9px;flex-wrap:wrap}

/* ---------- popover ---------- */
.pop{position:fixed;z-index:60;max-width:320px;background:var(--surface);
  border:1px solid var(--rule-3);padding:9px 11px;font-size:12.5px;color:var(--ink-2);
  box-shadow:0 2px 8px rgb(0 0 0 / .10);line-height:1.5}
.pop b{color:var(--ink)}
.pop dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin-top:5px}
.pop dt{font:620 10.5px/1.45 var(--font-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.pop dd{margin:0}

.foot{border-top:1px solid var(--rule);margin-top:20px;padding:16px 20px 90px}
.foot p{max-width:var(--maxw);margin:0 auto;font-size:12px;color:var(--ink-3)}

/* ---------- responsive ---------- */
@media (max-width:1179px){
  :root{--rail-w:0px}
  .shell{grid-template-columns:minmax(0,1fr);gap:0}
  .rail{display:none}
  .c-quant,.c-hw,.c-ev,.c-upd{display:none}
  .hw{grid-template-columns:minmax(0,1fr);gap:18px}
  .hw-pane{position:static}
  .model-master{grid-template-columns:minmax(0,1fr) minmax(320px,390px);gap:18px}
  .model-list-head,.model-row{grid-template-columns:minmax(180px,1.2fr) minmax(190px,1fr) 120px 30px}
  .model-list-head span:nth-child(2),.model-context{display:none}
}
@media (max-width:899px){
  /* The mode control adds a fixed-width group to an already-tight masthead;
     the methodology/contribute text links are the first thing to give,
     same as the 719px rule below -- earlier here because 834px (a real
     tablet width) is not covered by that rule. */
  .mast-util .ulink{display:none}
  .models-intro{display:block}
  .models-intro p{margin-top:6px}
  .model-controls{grid-template-columns:1fr 1fr 1fr}
  .model-search{grid-column:1/-1}
  .model-count{margin-top:0;align-self:end;padding-bottom:6px}
  .model-master{grid-template-columns:minmax(0,1fr)}
  .model-preview{position:static;grid-row:1;max-height:none;margin-top:12px}
  .model-index{grid-row:2}
  .model-list-head,.model-row{grid-template-columns:minmax(190px,1.2fr) minmax(200px,1fr) 126px 30px}
}
@media (max-width:719px){
  .mast-bar{height:auto;flex-wrap:wrap;padding:7px 14px 0;gap:10px}
  .mast-util .ulink{display:none}
  .tabs{order:3;flex-basis:100%;border-top:1px solid var(--rule)}
  .tab{flex:1;justify-content:center;height:42px;padding:0 3px;font-size:12px;
    white-space:nowrap;letter-spacing:-.01em}
  .mast-sub{padding:0 14px 7px;font-size:12px}
  .shell{padding:0 14px}
  .bar{top:0;position:relative}
  .mast{position:static}
  .shelf-top h2{font-size:21px}
  .shelf{scroll-margin-top:12px}
  .filters{gap:5px}
  .fsel select{max-width:112px}
  .cbx{width:20px;height:20px}
  .exp-btn{width:34px;height:34px;font-size:13px}
  .btn{height:34px;padding:0 12px}
  .crail{padding:9px 14px 10px}
  .crail-items{display:none}
  .crail-end{width:100%;margin-left:0}
  .cmp col.k{width:150px}
  .page{padding:14px 0 30px}
  .recipe-layout{grid-template-columns:minmax(0,1fr);gap:22px;margin-top:14px}
  .recipe-page>h1{font-size:39px;max-width:15ch}
  .recipe-rail{position:static;display:grid;grid-template-columns:1fr 1fr;gap:18px;border-top:1px solid var(--rule-2);padding-top:13px}
  .recipe-rail section+section{border-top:0;margin-top:0;padding-top:0}
  .recipe-actions .copy{width:100%}
  .det-grid{grid-template-columns:minmax(0,1fr)}
  .assump{padding:9px}
  .calc-tab th{width:auto;display:block;padding-bottom:0}
  .calc-tab td{display:block;padding-top:1px;padding-bottom:6px}
  /* label-above-value at narrow widths: a nowrap label column forces overflow */
  .kv{grid-template-columns:minmax(0,1fr);gap:0}
  .kv dt{white-space:normal;margin-top:7px}
  .kv dd{margin-bottom:2px}
  .det-res .row{grid-template-columns:minmax(0,1fr);gap:0}
  .cmp col.k{width:132px}
  .cmp th.k{font-size:9.5px}
  .models-home{padding-top:14px}
  .models-intro h1{font-size:24px;white-space:normal}
  .model-controls{grid-template-columns:1fr 1fr;gap:7px}
  .model-search{grid-column:1/-1}
  .model-controls select{width:100%;min-width:0}
  .model-controls label:nth-child(4){grid-column:1/-1}
  .model-count{grid-column:1/-1;padding:0}
  .model-preview{display:none}
  .model-index{grid-row:auto}
  .model-list-head{display:none}
  .model-row{grid-template-columns:minmax(0,1fr) auto;gap:8px;min-height:0;padding:12px 8px}
  .model-id{grid-column:1}
  .model-context{display:flex;grid-column:1}
  .model-floor{grid-column:1;margin-top:5px}
  .model-speed{grid-column:1;margin-top:5px}
  .model-open{grid-column:2;grid-row:1/-1;align-self:center}
  .model-page-baseline>.model-preview-head{display:none}
  .model-page-baseline .baseline-spec{grid-template-columns:minmax(0,1fr)}
  .model-page-baseline .baseline-spec>div.wide{grid-column:auto}
}
@media print{.mast,.rail,.bar,.crail,.foot{display:none}}

able Graphics Memory, and its developer article says up to 112 GB GPU-allocatable), bandwidth is the limiter at 256 GB/s.","256 GB/s sits just below DGX Spark's 273 GB/s and well below RTX 3090/4090 VRAM, so decode speed for a given model lands in the same band as the Spark rather than a discrete GPU.","Runtimes are llama.cpp/Vulkan/ROCm or ONNX-GenAI; there is no CUDA, so the CUDA-only speculative forks (DSpark, DFlash2) have no path here. AMD RDNA 3.5 supports FP8/FP16 but not the Blackwell-class FP4 paths.","System RAM is shared with the OS; the GPU-allocatable ceiling is an OEM BIOS setting, so a setup must state how much was assigned to the iGPU."],"device":{"identity":{"name":"AMD Ryzen AI Max+ 395 (Strix Halo)","chip":"Ryzen AI Max+ 395 (Strix Halo)","manufacturer":"AMD","os":"Windows / Linux","form_factor":"laptop/desktop"},"memory":{"total_gb":128,"type":"LPDDR5X-8000, 256-bit","bandwidth_gbs":256,"interface_bits":256,"unified":true,"usable_gb":112,"note":"AMD states 256-bit LPDDR5X with up to 128 GB system memory; its blog cites 256 GB/s and its developer article says up to 112 GB is GPU-allocatable (up to 96 GB convertible via Variable Graphics Memory)."},"compute":{"cpu_cores":"16x Zen 5, 32 threads","fp32_tflops":null,"fp16_dense_tflops":null,"note":"AMD publishes NPU up to 50 TOPS and overall platform up to 126 TOPS; it does not publish a clean GPU FP32/FP16 TFLOPS figure, so they stay null. The iGPU is 40 RDNA 3.5 CUs (Radeon 8060S)."},"thermal":{"tdp_watts":null,"cooling":"varies by OEM chassis","note":"Configurable TDP set by the OEM; AMD does not publish one figure."},"variants":[{"id":"ryzen-ai-max-395","name":"Ryzen AI Max+ 395","chip":"Strix Halo","memory_configs":"32-128 GB unified","bandwidth_gbs":256,"note":"40 RDNA 3.5 CUs; NPU up to 50 TOPS; up to 126 overall TOPS"}],"sources":[{"url":"https://www.amd.com/en/products/processors/laptop/ryzen/ai-300-series/amd-ryzen-ai-max-plus-395.html","note":"Ryzen AI Max+ 395: 256-bit LPDDR5x, max 128 GB, Flash is Apple-Silicon-only, but the vendor benchmarked DFlash2 on a rented RTX 6000 (2026-08, ledger [63]). Verify NVIDIA DFlash2 status before treating those numbers as engine-attributable.","TurboQuant headline claims (8x attention, 6x KV, zero accuracy loss at 3-bit) are Google H100 research figures, not Qwen-on-consumer-hardware measurements.","Repo license is 'Other'; began as a fork of Jan (Menlo Research). Repo: github.com/AtomicBot-ai/Atomic-Chat (1.4k stars, TypeScript)."],"arm64":true,"updated":"2026-09-12"},"custom-fork":{"id":"custom-fork","name":"Custom / forked engine","kind":"fork","url":null,"api":["varies"],"qwen_support":"Depends entirely on the fork. These entries exist because stock engines cannot serve the configuration.","spec_decode":["other"],"features":["builder-specific"],"notable_flags":[],"gotchas":["Not portable: the weights usually only load in the author's engine.","Reproducibility is the weakest tier in the directory. Treat claimed numbers as unverified until someone else runs them.","Always check the license of the engine separately from the license of the weights."],"arm64":null,"updated":"2026-09-05"},"llama-cpp":{"id":"llama-cpp","name":"llama.cpp","kind":"runtime","url":"https://github.com/ggml-org/llama.cpp","api":["openai"],"qwen_support":"GGUF quants of every Qwen generation, including MoE and VL via projector files.","spec_decode":["none"],"features":["gguf","cpu-gpu-split-offload","metal","cuda","vulkan","vision-via-projector","mmap"],"notable_flags":["-ngl (layers on GPU)","--ctx-size","-fa (flash attention)","--mmproj (vision projector)"],"gotchas":["Vision needs a separate mmproj file; it is not in the main GGUF.","No speculative decoding without a separate draft model and --model-draft.","The widest hardware reach of any engine: runs on CPU-only, 24GB cards, and Apple Silicon alike."],"arm64":true,"updated":"2026-09-05","caveats":["Qwen3.8-27B on CUDA: builds around commit 221f0f6 (shallow clones reporting 'build 1') pr  at a fixed ~8 events/s, so a client that counts events as tokens reads ~9 tok/s. Always count completion_tokens."},{"id":"m004","metric":"ttft_ms","value":8200,"unit":"ms","provenance":"box","date":"2026-08-19","n":1,"method":"bench/bench.sh wall-time probe on a fresh ~16K prompt, warm","note":"Cold boot is ~13s (Triton kernel warmup); the .cache/triton volume persists it."}],"caveats":["Not compatible with YaRN or context >262144. The rope override leaks into the draft config and crashes with AttributeError: 'PreTrainedConfig' object has no attribute 'max_position_embeddings'. Keep YARN=0 and CONTEXT_LENGTH=262144.","No released SGLang image has DFlash2 — it merged upstream 2026-08-19, after every published tag. start-dflash.sh builds the image from patch/ on first run, which needs git and network once.","Crash history, now fixed: the original head handling dequantized the whole NVFP4 lm_head (~2.5-5GB) during draft-graph capture and hard-rebooted the box at mem-fraction 0.95, and at 0.80 with concurrency >= 8-10. The image now runs the quantized head in place via lm_head.quant_method.apply. If you still see that reboot signature it is not the memory fraction.","Measured 2026-08-19 on a single boot, one day after the DSpark/MTP figures. Cross-engine deltas are indicative, not a race. The recommendation in the repo is one replication boot before switching a production default.","A minimal 5-file overlay build measured 61.1 code / 28.4 essay versus 50.9 / 25.4 for the whole-tree build at the same base digest — but that A/B is confounded (fresh boot, concurrency 10 vs 4), so it is recorded and not believed."],"provenance_tier":"box","sources":[{"url":"https://github.com/MiaAI-Lab/Qwen3.8-27B-SGLang-DGX-Spark","kind":"repo","note":"recipe + start-dflash.sh"},{"url":"https://huggingface.co/RadixArk/Qwen3.8-27B-NVFP4","kind":"model","note":"weights"},{"url":"https://huggingface.co/z-lab/Qwen3.8-27B-DFlash2","kind":"model","note":"block-diffusion draft"},{"url":"https://inco.ai/blog/dflash2/","kind":"blog","note":"DFlash2 write-up, serving recipe"},{"url":"https://github.com/sgl-project/sglang/commit/c14312a66","kind":"repo","note":"upstream DFlash2 support"}],"updated":"2026-09-05"},{"id":"qwen38-27b-nvfp4-packed-sglang-dspark","title":"Qwen3.8-27B NVFP4 (packed FP4 head) — SGLang + DSpark block-7","slug_note":"The code peak: 51.5 tok/s on the LRUCache probe, about 1.5x MTP. Gives the long essay back — 18.3 versus MTP's 24.1.","model":"qwen3-8-27b","status":"measured","variation":{"checkpoint":"RadixArk/Qwen3.8-27B-NVFP4","publisher":"radixark","quant":"nvfp4","quant_detail":"W4A4 body with lm_head packed to FP4. ~1.7GB smaller on disk than the BF16-head twin.","format":"safetensors","size_gb":21.9,"url":"https://huggingface.co/RadixArk/Qwen3.8-27B-NVFP4","license":"Apache-2.0","downloads":null},"engine":{"id":"sglang","config":"DSpark block-7 with 8 draft tokens, unquantized draft. torch.compile plus decode-graph caps, --num-continuous-decode-steps 2, prefill CUDA graphs off, flashinfer.","image":"lmsysorg/sglang:qwen38-27b","requires_fork":false,"draft_model":"RadixArk/Qwen3.8-27B-DSpark (~2.7GB, fetched once)","spec_decode":"dspark","flags":["--speculative-dspark-block-size 7","--speculative-num-draft-tokens 8","--cuda-graph-max-bs-decode 4","--mem-fraction-static 0.90","--kv-cache-dtype fp8_e4m3","--cpuset-cpus 5-9,15-19"]},"hardware":["dgx-spark"],"requirements":{"memory_gb":30,"disk_gb":25,"min_vram_gb":null,"notes":"~22GB target + ~2.7GB DSpark draft + KV pool at mem-fraction 0.90."},"capabilities":{"vision":true,"video":true,"tools":true,"thinking":true,"long_context":262144,"max_context":262144},"run":{"command":"./start-dspark.sh","repo":"https://github.com/MiaAI-Lab/Qwen3.8-27B-SGLang-DGX-Spark","profile":"profiles/qwen3.8-27b.env","steps":[{"kind":"cmd","text":"cp .env.sample .env"},{"kind":"cmd","text":"./start-dspark.sh"}],"auto_bootable":true},"measurements":[{"id":"m001","metric":"decode_code","value":51.5,"unit":"tok/s","stat":"median","provenance":"box","date":"2026-08-18","n":5,"method":"bench/ndec.py two-call net-decode, median of 5, tokens counted from the server's completion_tokens via stream_options.include_usage","range":[51.4,51.7],"note":"Block-7 is the measured code peak. Block-5 trades -16% code for +8% prose."},{"id":"m002","metric":"decode_essay","value":18.3,"unit":"tok/s","stat":"median","provenance":"box","date":"2026-08-18","n":5,"method":"bench/ndec.py two-call net-decode, median of 5, tokens counted from the server's completion_tokens via stream_options.include_usage","range":[18.2,18.3],"note":"The essay is what DSpark gives back versus MTP."},{"id":"m003","metric":"decode_chat","value":23.2,"unit":"tok/s","stat":"median","provenance":"box","date":"2026-08-18","n":5,"method":"bench/ndec.py two-call net-decode, median of 5, tokens counted from the server's completion_tokens via stream_options.include_usage; streamed, temperature 1.0, thinking on","note":"Slightly beat MTP (21.0) on default chat with thinking on and no degrade. Thinking-off chat was a small MTP edge (22.0 / 21.3 here vs 24.6 / 23.4)."}],"caveats":["Not compatible with YaRN or context >262144 — same draft-config leak as DFlash2. Keep YARN=0 and CONTEXT_LENGTH=262144.","--cuda-graph-max-bs is a deprecated alias in this build; the DSpark stack uses --cuda-graph-max-bs-decode 4.","--speculative-accept-threshold-acc below 1.0 measured worse. Leave it at 1.0.","The DSpark draft was trained on FP8, but switching the target to QUANT=fp8 did not lift acceptance.","Recorded on the older stock image with an event-counting script for the short-chat cell, where events did approximate single tokens. That is not true of the DFlash2 image."],"provenance_tier":"box","sources":[{"url":"https://github.com/MiaAI-Lab/Qwen3.8-27B-SGLang-DGX-Spark","kind":"repo","note":"recipe + start-dspark.sh"},{"url":"https://huggingface.co/RadixArk/Qwen3.8-27B-DSpark","kind":"model","note":"DSpark draft"},{"url":"https://github.com/hasso5703/dgx-spark-qwen38","kind":"repo","note":"published DSpark-on-GB10 config this stack builds on"},{"url":"https://docs.sglang.io/cookbook/autoregressive/Qwen/Qwen3.8-27B","kind":"docs","note":"SGLang DGX Spark serving recipe"}],"updated":"2026-09-05"},{"id":"qwen38-27b-nvfp4-packed-sglang-mtp","title":"Qwen3.8-27B NVFP4 (packed FP4 head) — SGLang + EAGLE/MTP 3/1/4","slug_note":"The long-form writing choice, and the only path that supports YaRN out to 1M context. Slower on code: 34.5 versus DSpark's 51.5.","model":"qwen3-8-27b","status":"measured","variation":{"checkpoint":"RadixArk/Qwen3.8-27B-NVFP4","publisher":"radixark","quant":"nvfp4","quant_detail":"W4A4 body with lm_head packed to FP4. ~1.7GB smaller on disk than the BF16-head twin.","format":"safetensors","size_gb":21.9,"url":"https://huggingface.co/RadixArk/Qwen3.8-27B-NVFP4","license":"Apache-2.0","downloads":null},"engine":{"id":"sglang","config":"EAGLE speculative decoding against the checkpoint's in-checkpoint MTP head, steps/topk/draft = 3/1/4 (the measured peak; the sweep gave 2->12.8, 3->17.2, 4->16.8, 5->16.3, 6->15.8). topk=1 requires draft = steps+1, validated at launch.","image":"lmsysorg/sglang:qwen38-27b","requires_fork":false,"draft_model":null,"spec_decode":"mtp","flags":["--speculative-algorithm EAGLE","--speculative-num-steps 3","--speculative-eagle-topk 1","--speculative-num-draft-tokens 4","--mem-fraction-static 0.95","--kv-cache-dtype fp8_e4m3","--enable-metrics","--enable-cache-report"]},"hardware":["dgx-spark"],"requirements":{"memory_gb":30,"disk_gb":22,"min_vram_gb":null,"notes":"~22GB target, no separate draft download (MTP head is in the checkpoint). mem-fraction 0.95."},"capabilities":{"vision":true,"video":true,"tools":true,"thinking":true,"long_context":262144,"max_context":1000000},"run":{"command":"./start.sh","repo":"https://github.com/MiaAI-Lab/Qwen3.8-27B-SGLang-DGX-Spark","profile":"profiles/qwen3.8-27b.env","steps":[{"kind":"cmd","text":"cp .env.sample .env"},{"kind":"cmd","text":"./start.sh"}],"auto_bootable":true},"measurements":[{"id":"m001","metric":"decode_code","value":34.5,"unit":"tok/s","stat":"median","provenance":"box","date":"2026-08-18","n":5,"method":"bench/ndec.py two-call net-decode, median of 5, tokens counted from the server's completion_tokens via stream_options.include_usage","range":[34.5,34.6]},{"id":"m002","metric":"decode_essay","value":24.1,"unit":"tok/s","stat":"median","provenance":"box","date":"2026-08-18","n":5,"method":"bench/ndec.py two-call net-decode, median of 5, tokens counted from the server's completion_tokens via stream_options.include_usage","range":[24.1,24.1],"note":"The MTP prose win is specifically the long essay."},{"id":"m003","metric":"decode_chat","value":21.0,"unit":"tok/s","stat":"median","provenance":"box","date":"2026-08-18","n":5,"method":"bench/ndec.py two-call net-decode, median of 5, tokens counted from the server's completion_tokens via stream_options.include_usage; streamed, temperature 1.0, thinking on","note":"Thinking-off: 24.6 at T=0, 23.4 at T=1."}],"caveats":["Wall-time figures from bench/bench.sh are a different clock and are not comparable to the net-decode table: thinking 17.2-20.5 tok/s, non-thinking 21.6-22.7, tool-call 26-28, TTFT on a fresh ~16K prompt ~8.3s warm / ~13s first boot.","NGRAM speculative decoding measured ~30% under MTP and was rejected. Prefill CUDA graphs were also rejected — this build auto-disables them on this model anyway because GDN layers are not standard GQA.","Every Tier A (kernel-path) and Tier B (config/host) tuning experiment measured zero net gain. These flags are the local optimum on this box, not a starting point.","This is the only engine path here that supports YaRN. DSpark and DFlash2 both crash above 262144."],"provenance_tier":"box","sources":[{"url":"https://github.com/MiaAI-Lab/Qwen3.8-27B-SGLang-DGX-Spark","kind":"repo","note":"recipe + start.sh"},{"url":"https://docs.sglang.io/cookbook/autoregressive/Qwen/Qwen3.8- var SIBLINGS = {};

    var k = siblingKey(s);

var CMP_MAX = 4;

function comparability(list) {
  var out = [];
  if (list.length < 2) return out;
  function vals(fn) { return uniq(list.map(fn)); }
  var hws = vals(function (s) { return hwKey(s); });
  if (hws.length > 1) {
    var bw = list.map(function (s) {
      var h = HW[(s.hardware || [])[0]] || {};
      return h.bandwidth_gbs || (h.bandwidth_range_gbs || [])[0] || null;
    }).filter(Boolean);
    var extra = "";
    if (bw.length > 1) {
      var r = Math.max.apply(null, bw) / Math.min.apply(null, bw);
      if (r >= 1.2) extra = " Memory bandwidth differs by about " + (Math.round(r * 10) / 10) + "×.";
    }
    out.push({ k: "hardware", t: "Measured on different hardware — " + list.map(function (s) {
      return String(hwFirstLabel(s) || "unrecorded").split(",")[0];
    }).join(" vs ") + "." + extra });
  }
  if (vals(function (s) { return (s.engine || {}).id; }).length > 1)
    out.push({ k: "engine", t: "Different engines — " + list.map(function (s) { return (ENG[(s.engine || {}).id] || {}).name || "?"; }).join(" vs ") + ". Engine choice changes decode speed independently of the weights." });
  if (vals(function (s) { return s.model; }).length > 1)
    out.push({ k: "model", t: "Different model families — this compares runtimes and artifacts, not the same weights." });
  var reps = list.map(repDecode);
  var withRep = reps.filter(Boolean);
  if (withRep.length > 1) {
    if (uniq(withRep.map(function (m) { return m.metric; })).length > 1)
      out.push({ k: "metric", t: "Different workloads — " + uniq(withRep.map(function (m) { return metricWord(m.metric); })).join(" vs ") + " decode." });
    if (uniq(withRep.map(function (m) { return m.stat || "unstated"; })).length > 1)
      out.push({ k: "stat", t: "Different statistics — " + uniq(withRep.map(function (m) { return m.stat || "unstated"; })).join(" vs ") + "." });
    if (uniq(withRep.map(function (m) { return m.concurrency == null ? "unstated" : String(m.concurrency); })).length > 1)
      out.push({ k: "conc", t: "Different concurrency on the compared figure. These are different quantities." });
    if (uniq(withRep.map(function (m) { return m.provenance; })).length > 1)
      out.push({ k: "prov", t: "Different evidence tiers — " + uniq(withRep.map(function (m) { return m.provenance; })).join(" and ") + ". Tiers are never blended." });
    /* Free-form method prose often names the same protocol differently. Use
       the recorded grade as the stable discriminator, and always separate the
       materially different wall-clock/eval cases even when no grade exists. */
    var methods = uniq(withRep.map(function (m) {
      var grade = m.evidence && m.evidence.method_grade;
      var text = String(m.method || "").toLowerCase();
      var family = /wall[ -]?clock/.test(text) ? "wall-clock" : (/eval(_duration)?|eval rate/.test(text) ? "eval" : "");
      return grade ? "grade: " + grade : family;

    if (methods.length > 1)
      out.push({ k: "method", t: "Different measurement methods — " + methods.join(" vs ") + ". Wall-clock and eval measurements are different quantities." });
  }
  if (withRep.length < list.length)
    out.push({ k: "coverage", t: (list.length - withRep.length) + " of " + list.length + " recipes carry no single-stream speed measurement — the performance section is partly empty by design." });
  var tc = uniq(list.map(function (s) { return (s.capabilities || {}).long_context; }));
  if (tc.length > 1) out.push({ k: "context", t: "Different recorded context ceilings — " + tc.map(function (x) { return x == null ? "unrecorded" : ctx(x); }).join(" vs ") + "." });
  return out;
}

/* ------------------------------------------------------------- detection */
function detectMachine(cb) {
  var got = {}, notes = [], done = 0, expect = 1;
  var nav = navigator;
  var uad = nav.userAgentData;
  var plat = (uad && uad.platform) || nav.platform || "";
  if (/mac/i.test(plat)) got.os = "macos";
  else if (/win/i.test(plat)) got.os = "windows";
  else if (/linux|x11/i.test(plat)) got.os = "linux";
  if (got.os) notes.push(["Platform", got.os, "from navigator.userAgentData"]);
  else notes.push(["Platform", "not detectable", "the browser does not expose it"]);

  if (nav.hardwareConcurrency) notes.push(["CPU threads", String(nav.hardwareConcurrency), "logical cores, from navigator.hardwareConcurrency — not the chip name"]);
  else notes.push(["CPU threads", "not detectable", "navigator.hardwareConcurrency unavailable"]);

  if (nav.deviceMemory) notes.push(["RAM", nav.deviceMemory + " GB reported", "navigator.deviceMemory rounds down to a power of two and caps at 8 — enter your real figure below"]);
  else notes.push(["RAM", "not detectable", "navigator.deviceMemory is Chromium-only — enter it yourself"]);

  var gl = null;
  try {
    var c = document.createElement("canvas");
    gl = c.getContext("webgl") || c.getContext("experimental-webgl");
    if (gl) {
      var ext = gl.getExtension("WEBGL_debug_renderer_info");
      var r = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
      if (r) { got.gpu = String(r); notes.push(["GPU", got.gpu, "from the WebGL renderer string — often masked for fingerprinting reasons"]); }
    }
  } catch (e) { /* blocked contexts are expected */ }
  if (!got.gpu) notes.push(["GPU", "not detectable", "the WebGL renderer string is masked or unavailable"]);

  notes.push(["VRAM · free disk · driver · runtime · power limit", "not detectable", "no browser API exposes these — they are always manual"]);

  function finish() {
    done++;
    if (done >= expect) cb(got, notes);
  }
  var timer = setTimeout(function () { expect = 0; cb(got, notes); }, 2000);
  if (nav.gpu && nav.gpu.requestAdapter) {
    nav.gpu.requestAdapter().then(function (ad) {
      try {
        var info = ad && (ad.info || (ad.requestAdapterInfo ? null : null));
        if (info && (info.vendor || info.architecture)) {
          var t = [info.vendor, info.architecture, info.description].filter(Boolean).join(" ");
          if (t.trim()) { got.gpu = got.gpu || t; notes.push(["WebGPU adapter", t, "from navigator.gpu adapter info"]); }
        } else notes.push(["WebGPU adapter", "masked", "the browser exposes no adapter vendor or architecture"]);
      } catch (e) { notes.push(["WebGPU adapter", "masked", "adapter info unavailable"]); }
      clearTimeout(timer); if (expect) finish();
    }, function () {
      notes.push(["WebGPU adapter", "unavailable", "no WebGPU adapter could be requested"]);
      clearTimeout(timer); if (expect) finish();
    });
  } else {
    notes.push(["WebGPU adapter", "unavailable", "navigator.gpu is not present in this browser"]);
    clearTimeout(timer); finish();
  }
}

  var node = document.querySelector('[data-row="' + id + '"]');
  if (!node) { route(); return; }
  var s = SETUPS.filter(function (x) { return x.id === id; })[0];
  if (state.mobile) {
    var li = document.createElement("li");
    li.innerHTML = rowLi(s);
    node.replaceWith(li.firstElementChild);
  } else {
    var tb = node.parentNode, tmp = document.createElement("tbody");
    tmp.innerHTML = rowTr(s);
    var next = node.nextElementSibling;
    if (next && next.classList.contains("det")) next.remove();
    var frag = document.createDocumentFragment();
    while (tmp.firstChild) frag.appendChild(tmp.firstChild);
    tb.replaceChild(frag, node);
  }
  var btn = document.querySelector('[data-exp="' + id + '"]');
  if (btn) btn.focus();
  renderRail();
}

/* popover for the evidence strip */
function showPop(anchor, id) {
  var s = SETUPS.filter(function (x) { return x.id === id; })[0];
  if (!s) return;
  var c = conf(s), pop = el("pop");
  pop.innerHTML = "<b>" + esc("Evidence for this recipe") + "</b><dl>" + DIMS.map(function (d) {
    var v = c[d[0]], l = LV[v.k];
    return "<dt>" + esc(d[1]) + '</dt><dd><span class="' + l.cls + '">' + esc(l.g + " " + v.t) + "</span><br>" +
      '<span class="g">' + esc(v.why) + "</span></dd>";
  }).join("") + "</dl>";
  pop.hidden = false;
  var r = anchor.getBoundingClientRect();
  var w = Math.min(320, window.innerWidth - 16);
  pop.style.width = w + "px";
  var left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8));
  pop.style.left = left + "px";
  var top = r.bottom + 6;
  if (top + pop.offsetHeight > window.innerHeight - 8) top = Math.max(8, r.top - pop.offsetHeight - 6);
  pop.style.top = top + "px";
}
function hidePop() { var p = el("pop"); if (p) p.hidden = true; }
document.addEventListener("mouseover", function (e) {
  var t = e.target.closest && e.target.closest("[data-ev]");
  if (t) showPop(t, t.getAttribute("data-ev"));
});
document.addEventListener("scroll", function () { hidePop(); spy(); }, true);

/* scroll-spy on the family rail */
var spyTimer = null;
function spy() {
   if (state.route !== "directory" || state.mobile) return;
  clearTimeout(spyTimer);
  spyTimer = setTimeout(function () {
    var best = null, bestTop = Infinity;
    document.querySelectorAll(".shelf").forEach(function (sec) {
      var t = sec.getBoundingClientRect().top;
      if (t <= 160 && t > -sec.offsetHeight) { if (Math.abs(t) < bestTop) { bestTop = Math.abs(t); best = sec.id; } }
    });
    document.querySelectorAll("[data-jump]").forEach(function (a) {
      if (a.getAttribute("data-jump") === best) a.setAttribute("data-spy", "1"); else a.removeAttribute("data-spy");
    });
  }, 90);
}

/* ------------------------------------------------------------------ boot */
(function boot() {
  var th = store("qlr.theme");
  if (th) document.documentElement.setAttribute("data-theme", th);
  var saved = sess("qlr.compare");
  if (Array.isArray(saved)) state.compare = saved.filter(function (id) { return SETUPS.some(function (s) { return s.id === id; }); }).slice(0, CMP_MAX);
  var prof = store("qlr.profile.current");
  if (prof) state.profile = prof;

  // Path shim: keep the documented paths working if the site ever moves to a
  // host with directory rewrites. ifhost serves exactly one file at /.
  if (/^https?:$/.test(location.protocol)) {
    var pn = location.pathname.replace(/\/index\.html$/, "");
    var m = pn.match(/\/(hardware|compare|methodology|contribute|models\/[^/]+|recipes(?:\/[^/]+)?|publishers\/[^/]+)\/?$/);
    if (m && !location.hash) { location.replace(location.origin + "/#/" + m[1]); return; }
  }

  el("gen").textContent = D.generated;
  MOBILE.addEventListener ? MOBILE.addEventListener("change", function (e) { state.mobile = e.matches; route(); })
    : MOBILE.addListener(function (e) { state.mobile = e.matches; route(); });
  window.addEventListener("hashchange", route);
  window.addEventListener("resize", function () {
    var mob = MOBILE.matches;
    if (mob !== state.mobile) { state.mobile = mob; route(); }
  });
  route();
})();

})();

</script>
